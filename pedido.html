<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fazer pedido</title>
<meta name="theme-color" content="#1f5c3d">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f3f5f1;--surface:#fff;--line:#d3dacd;--fg:#1b241d;--muted:#5d6a60;--brand:#1f5c3d;--brand-fg:#fff;--brand-soft:#dbe9df;--bad:#b3261e;--warn-soft:#fbecc9;
  --display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#121713;--surface:#1a211c;--line:#334036;--fg:#e6ece6;--muted:#9aa89d;--brand:#5fb487;--brand-fg:#0d1a12;--brand-soft:#21382a;--bad:#f2867c;--warn-soft:#3a2f17;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body)}
main{max-width:480px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.6rem}h2{font-size:1.1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
ul{margin:0;padding-left:20px}
label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem;color:var(--muted)}
input,textarea{font:inherit;color:inherit;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
textarea{min-height:64px;resize:vertical}
button{font:inherit;cursor:pointer}
.qty{display:flex;align-items:center;gap:14px}
.qty button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1.5rem;font-weight:700}
.qty b{font-family:var(--display);font-size:2rem;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.main{background:var(--brand);color:var(--brand-fg);border:0;border-radius:10px;padding:14px;font-weight:700;font-size:1.05rem}
.ghost{background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px;font-weight:700}
.err{color:var(--bad);margin:0}
.chk{flex-direction:row;align-items:center;gap:10px;background:var(--brand-soft);color:var(--fg);border-radius:10px;padding:12px;font-size:1rem}
.chk input{width:22px;height:22px;flex:none}
.ok{background:var(--brand-soft);border-radius:12px;padding:18px;text-align:center}
.banner{background:var(--warn-soft);border-radius:10px;padding:10px 12px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<main>
  <img id="logo" alt="" hidden style="width:96px;height:96px;object-fit:contain;border-radius:18px;background:#fff;align-self:center">
  <div><h1 id="rest">Cardápio do dia</h1><p class="muted" id="sub" style="margin:4px 0 0">Carregando...</p></div>
  <section class="card" id="menuBox" hidden><h2>Hoje tem</h2><ul id="menu"></ul><p class="muted" id="menuObs" style="margin:0"></p></section>
  <section class="card" id="formBox" hidden>
    <label>Seu WhatsApp (com DDD)<input type="tel" id="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 91234-5678"></label>
    <label>Seu nome<input type="text" id="nome" autocomplete="name"></label>
    <div><div style="font-weight:700;font-size:.9rem;color:var(--muted);margin-bottom:6px">Quantas marmitas?</div>
      <div class="qty"><button type="button" id="menos" aria-label="Menos uma">−</button><b id="q">1</b><button type="button" id="mais" aria-label="Mais uma">+</button></div></div>
    <label>Observação (opcional)<input type="text" id="obs" placeholder="Ex.: sem cebola"></label>
    <label class="chk" id="usarBox" hidden><input type="checkbox" id="usar" checked> Entregar no meu endereço cadastrado</label>
    <label id="endLbl"><span id="endTit">Endereço para entrega</span><textarea id="end" placeholder="Rua, número, complemento, bairro"></textarea></label>
    <p class="err" id="err"></p>
    <button class="main" id="enviar">Confirmar pedido</button>
    <button class="ghost" id="nao">Não quero hoje</button>
  </section>
  <section class="ok" id="okBox" hidden><h2 id="okTit">Pedido confirmado!</h2><p id="okTxt" style="margin:6px 0 12px"></p><button class="ghost" id="editar">Mudar pedido</button></section>
  <p class="banner" id="fechado" hidden></p>
</main>
<script>
(function(){
"use strict";
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD35S_8juHbOlb8DLssGdbuvhqzvuBE1bo",
  authDomain: "marmitex-148de.firebaseapp.com",
  projectId: "marmitex-148de",
  storageBucket: "marmitex-148de.firebasestorage.app",
  messagingSenderId: "162985128880",
  appId: "1:162985128880:web:492aa9289d5301d1b71c75"
};
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const now = new Date(), hoje = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
const dParam = new URLSearchParams(location.search).get("d");
const d = /^\d{4}-\d{2}-\d{2}$/.test(dParam||"") ? dParam : hoje;
const [Y,M,D] = d.split("-").map(Number), dt = new Date(Y,M-1,D);
const DIAS = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const normPhone = r => { let x = String(r||"").replace(/\D/g,"").replace(/^0+/,""); if(x.length===10||x.length===11) x = "55"+x; return x; };
let qtd = 1, info = {};
const mem = k => { try{ return localStorage.getItem("pedido-"+k)||""; }catch(e){ return ""; } };
const lembrar = (k,v) => { try{ localStorage.setItem("pedido-"+k, v); }catch(e){} };
$("#tel").value = mem("tel"); $("#nome").value = mem("nome");
const setQ = n => { qtd = Math.max(1, Math.min(20, n)); $("#q").textContent = qtd; };
$("#menos").onclick = () => setQ(qtd-1); $("#mais").onclick = () => setQ(qtd+1);
$("#sub").textContent = DIAS[dt.getDay()][0].toUpperCase()+DIAS[dt.getDay()].slice(1)+", "+pad(D)+"/"+pad(M);
if(!window.firebase || !FIREBASE_CONFIG){ $("#sub").textContent = "Não foi possível carregar. Confira a internet e abra o link de novo."; return; }
firebase.initializeApp(FIREBASE_CONFIG);
const fs = firebase.firestore();
function prazoPassou(){
  if(d > hoje) return false; if(d < hoje) return true;
  const m = String(info.horarioLimite||"").match(/(\d{1,2})[:h](\d{2})?/); if(!m) return false;
  return now.getHours()*60+now.getMinutes() > Number(m[1])*60+Number(m[2]||0);
}
Promise.all([fs.collection("publico").doc("info").get().catch(()=>null), fs.collection("cardapios").doc(d).get().catch(()=>null)]).then(([pi, cd]) => {
  info = pi && pi.exists ? pi.data() : {};
  if(info.restaurante){ $("#rest").textContent = info.restaurante; document.title = "Pedido · "+info.restaurante; }
  if(/^data:image\/(png|jpeg|webp);base64,/.test(info.logo||"")){ $("#logo").src = info.logo; $("#logo").hidden = false; const l = document.querySelector('link[rel="icon"]'); if(l) l.href = info.logo; }
  if(/^#[0-9a-f]{6}$/i.test(info.cor||"")) document.documentElement.style.setProperty("--brand", info.cor);
  const c = cd && cd.exists ? cd.data() : null;
  if(c && (c.itens||[]).length){
    $("#menu").innerHTML = ""; c.itens.forEach(i => { const li = document.createElement("li"); li.textContent = i.nome; $("#menu").appendChild(li); });
    $("#menuObs").textContent = [c.preco ? "Marmita avulsa: "+Number(c.preco).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}) : "", c.obs||""].filter(Boolean).join(" · ");
    $("#menuBox").hidden = false;
  }
  if(prazoPassou()){
    $("#fechado").textContent = "Os pedidos para este dia já encerraram"+(info.horarioLimite?" (até "+info.horarioLimite+")":"")+"."+(info.telefone?" Fale com a gente no WhatsApp: +"+info.telefone:"");
    $("#fechado").hidden = false; return;
  }
  if(info.horarioLimite) $("#sub").textContent += " · pedidos até "+info.horarioLimite;
  $("#formBox").hidden = false;
});
// Cliente já cadastrado com endereço: o sistema guarda só um código do telefone (sem dados pessoais)
let conhecido = null, chkT, ultimoTel = "";
async function hashTel(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("marmitex:"+t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function mostrarEndereco(){
  const usa = conhecido===true && $("#usar").checked;
  $("#usarBox").hidden = conhecido!==true; $("#endLbl").hidden = usa;
  $("#endTit").textContent = conhecido===true ? "Outro endereço, só para este pedido" : "Endereço para entrega";
}
async function checarCliente(){
  const tel = normPhone($("#tel").value); if(tel===ultimoTel) return; ultimoTel = tel;
  if(tel.length<12 || tel.length>13 || !window.crypto || !crypto.subtle){ conhecido = null; mostrarEndereco(); return; }
  try{ const d = await fs.collection("conhecidos").doc(await hashTel(tel)).get(); if(normPhone($("#tel").value)!==tel) return; conhecido = d.exists; if(conhecido) $("#usar").checked = true; }
  catch(e){ conhecido = null; }
  mostrarEndereco();
}
$("#tel").addEventListener("input", () => { clearTimeout(chkT); chkT = setTimeout(checarCliente, 400); });
$("#usar").onchange = () => { mostrarEndereco(); if(!$("#usar").checked) $("#end").focus(); };
if($("#tel").value) checarCliente();
async function enviar(q){
  const tel = normPhone($("#tel").value), nome = $("#nome").value.trim();
  $("#err").textContent = "";
  if(tel.length<12 || tel.length>13){ $("#err").textContent = "Digite seu WhatsApp com DDD, por exemplo (11) 91234-5678."; $("#tel").focus(); return; }
  if(!nome){ $("#err").textContent = "Digite seu nome."; $("#nome").focus(); return; }
  const endereco = conhecido===true && $("#usar").checked ? "" : $("#end").value.trim();
  if(q>0 && conhecido===false && !endereco){ $("#err").textContent = "Digite o endereço de entrega."; $("#end").focus(); return; }
  const btns = [$("#enviar"), $("#nao")]; btns.forEach(b => b.disabled = true);
  try{
    await fs.collection("respostas").doc(d+"_"+tel).set({data:d, telefone:tel, nome:nome.slice(0,80), qtd:q, obs:$("#obs").value.trim().slice(0,300), endereco:endereco.slice(0,300), hora:new Date().toISOString()});
    lembrar("tel", $("#tel").value.trim()); lembrar("nome", nome);
    $("#formBox").hidden = true; $("#okBox").hidden = false;
    $("#okTit").textContent = q ? "Pedido confirmado!" : "Tudo certo!";
    $("#okTxt").textContent = q ? q+(q>1?" marmitas":" marmita")+" para "+DIAS[dt.getDay()]+", "+pad(D)+"/"+pad(M)+". Obrigado!" : "Anotamos que você não vai querer marmita neste dia.";
  }catch(e){ $("#err").textContent = "Não foi possível enviar. Confira a internet e tente de novo."; }
  btns.forEach(b => b.disabled = false);
}
$("#enviar").onclick = () => enviar(qtd);
$("#nao").onclick = () => enviar(0);
$("#editar").onclick = () => { $("#okBox").hidden = true; $("#formBox").hidden = false; };
})();
</script>
</body>
</html>
