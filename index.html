<style>
/* Layout: app shell. Sidebar on desktop, bottom tab bar on phone. Deep leaf green + pepper red, cool paper neutrals. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface2:#e8ece5; --line:#d3dacd;
  --fg:#1b241d; --muted:#5d6a60;
  --brand:#1f5c3d; --brand-fg:#ffffff; --brand-soft:#dbe9df;
  --accent:#c2412d; --accent-soft:#f6dfd9;
  --ok:#2c7a4b; --warn:#a86b00; --warn-soft:#fbecc9; --bad:#b3261e;
  --display:"Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121713; --surface:#1a211c; --surface2:#232c25; --line:#334036;
  --fg:#e6ece6; --muted:#9aa89d;
  --brand:#5fb487; --brand-fg:#0d1a12; --brand-soft:#21382a;
  --accent:#ef7a62; --accent-soft:#3d231d;
  --ok:#6cc68f; --warn:#e3b04b; --warn-soft:#3a2f17; --bad:#f2867c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121713; --surface:#1a211c; --surface2:#232c25; --line:#334036;
  --fg:#e6ece6; --muted:#9aa89d;
  --brand:#5fb487; --brand-fg:#0d1a12; --brand-soft:#21382a;
  --accent:#ef7a62; --accent-soft:#3d231d;
  --ok:#6cc68f; --warn:#e3b04b; --warn-soft:#3a2f17; --bad:#f2867c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.02rem}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{font-family:var(--display);font-weight:700;font-size:1.3rem;padding:4px 10px 18px;color:var(--brand)}
.logo small{display:block;font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--muted)}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--muted);font-weight:700}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:var(--surface2);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
main{min-width:0;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:.88rem}
.btn:focus-visible,.navbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.day:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--brand-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--accent-soft);color:var(--bad)}
.muted{color:var(--muted)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface2)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted);min-width:0}
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.form .c2{grid-column:span 2}.form .c3{grid-column:span 3}.form .c4{grid-column:span 4}.form .c6{grid-column:span 6}
.check{display:flex;align-items:center;gap:8px;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:760px;padding:20px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.modal .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.banner{border-radius:var(--r);padding:10px 14px;background:var(--warn-soft);color:var(--fg);font-size:.9rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:700}
.day{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:6px;font-variant-numeric:tabular-nums;font-weight:700;min-width:0}
.day.open{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.blank{visibility:hidden}
.day .dot{font-size:.62rem;font-weight:700;opacity:.9}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr 170px auto;gap:8px;align-items:center}
.msg{white-space:pre-wrap;background:var(--surface2);border-radius:8px;padding:12px;font-size:.92rem;max-height:340px;overflow:auto}
.mods{display:grid;gap:8px}
.mod{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mod p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:700;z-index:60}
.empty{padding:28px;text-align:center;color:var(--muted)}
.menu-list{margin:6px 0 0;padding-left:18px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.sn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;border:2px solid var(--line);color:var(--muted)}
.step.done .sn{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.sb{min-width:0;display:flex;flex-direction:column;gap:8px}
.sb p{margin:0;color:var(--muted);font-size:.9rem}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.results{display:flex;flex-direction:column;gap:6px}
.res{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.res div{min-width:0}
.bar{height:8px;border-radius:4px;background:var(--brand);display:inline-block;vertical-align:middle}
.bar.av{background:var(--accent)}
a.btn{text-decoration:none;color:inherit;display:inline-block}
a.btn.primary{color:var(--brand-fg)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:40;gap:0;overflow-x:auto}
  .logo{display:none}
  .navbtn{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 6px;min-width:58px;align-items:center}
  .form{grid-template-columns:1fr 1fr}
  .form .c2,.form .c3{grid-column:span 1}.form .c4,.form .c6{grid-column:span 2}
  .item{grid-template-columns:1fr auto}
  .item select{grid-column:1/2}
  h1{font-size:1.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <nav class="side" id="nav" aria-label="Seções"></nav>

<div id="modalRoot"></div>

<script>
(function(){
"use strict";
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => iso(new Date());
const addDays = (s,n) => { const d = parseIso(s); d.setDate(d.getDate()+n); return iso(d); };
const DOW = ["dom","seg","ter","qua","qui","sex","sáb"];
const DOW_LONG = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const fmtDate = s => { if(!s) return "—"; const d = parseIso(s); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(); };
const brl = n => (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function normPhone(raw){
  let d = String(raw||"").replace(/\D/g,"");
  if(!d) return "";
  if(d.startsWith("0")) d = d.replace(/^0+/,"");
  if(d.length===10||d.length===11) d = "55"+d;
  return d;
}
function fmtPhone(d){
  if(!d) return "—";
  if(d.startsWith("55") && (d.length===12||d.length===13)){
    const ddd = d.slice(2,4), n = d.slice(4);
    return "("+ddd+") "+(n.length===9? n.slice(0,5)+"-"+n.slice(5) : n.slice(0,4)+"-"+n.slice(4));
  }
  return "+"+d;
}
const PAGAMENTOS = ["Pix","Dinheiro","Cartão de débito","Cartão de crédito","Vale-refeição","Boleto","Outro"];
const CATEGORIAS = ["Prato principal","Guarnição","Salada","Sobremesa","Bebida","Opção vegetariana"];
const MODULOS = [
  {id:"hoje",nome:"Dia",desc:"Passo a passo do dia: cardápio, envio, confirmações e lista de entrega.",fixo:true},
  {id:"clientes",nome:"Clientes",desc:"Cadastro e importação do WhatsApp."},
  {id:"planos",nome:"Planos",desc:"Planos prontos e personalizados."},
  {id:"cardapio",nome:"Cardápio",desc:"Cardápio do dia e mensagem pronta para o WhatsApp."},
  {id:"calendario",nome:"Calendário",desc:"Dias em que o restaurante abre."},
  {id:"relatorios",nome:"Relatórios",desc:"Clientes de plano e avulsos, saldos e totais por dia, semana e mês."},
  {id:"entregas",nome:"Entregas",desc:"Entregadores, divisão por bairro, rotas no mapa e lista de produção."},
  {id:"financeiro",nome:"Financeiro",desc:"Recebimentos, despesas, a receber, previsões e lucro."},
  {id:"marketing",nome:"Marketing",desc:"Link para Instagram, campanhas, indicações e clientes para reativar."},
  {id:"ajustes",nome:"Ajustes",desc:"Módulos e dados do restaurante.",fixo:true},
];
const ICONS = {
  hoje:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  clientes:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/>',
  planos:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  cardapio:'<path d="M3 13h18a9 9 0 0 1-18 0Z"/><path d="M12 4v5M8 6v3M16 6v3"/>',
  calendario:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  relatorios:'<path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/>',
  entregas:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6M6 14l3-7h4l2 4h3l3 3M13 7h-2"/>',
  financeiro:'<rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M3 10h2M19 15h2"/>',
  marketing:'<path d="M3 11v3l12 5V6L3 11Z"/><path d="M18 9a4 4 0 0 1 0 6M7 15l1 5h3l-1-4"/>',
  ajustes:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
};
const icon = id => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[id]||"")+'</svg>';

// ---------- state ----------
const DEFAULT_CONFIG = {restaurante:"", meuNomeWhats:"", horarioLimite:"10:30", alertaSaldo:3, alertaDias:5, msgAlerta:"Olá {nome}! Restam {saldo} marmitas no seu plano {plano}, que vai até {fim}. Quer renovar?", enderecoRestaurante:"", cidade:"", custoMarmita:0, custoFixoMensal:0, telefoneRestaurante:"", premioIndicacao:"1 marmita grátis", abertos:[], modulos:{clientes:true,planos:true,cardapio:true,calendario:true,relatorios:true,entregas:true,financeiro:true,marketing:true}};
const S = {clientes:[], planos:[], cardapios:{}, config:structuredClone(DEFAULT_CONFIG), tab:"hoje", loaded:{}, mode:"loading",
  busca:"", filtro:"todos", mostrar:100, cardData:today(), calMes:today().slice(0,7), pedidos:{}, entregadores:[], fin:{}, finPeriodo:"mes", diaData:today(), confBusca:"", relPeriodo:"7", relTipo:"todos"};

// ---------- store (shared db, or this-browser fallback) ----------
const Store = {
  fs:null, local:null, subs:{},
  async init(){
    this.fs = window.__fs || null;
    if(this.fs){ S.mode = "cloud"; return; }
    S.mode = "local";
    try{ this.local = JSON.parse(localStorage.getItem("marmitex-local")||"null"); }catch(e){}
    if(!this.local) this.local = {clientes:{},planos:{},cardapios:{},config:{}};
  },
  saveLocal(){ try{ localStorage.setItem("marmitex-local", JSON.stringify(this.local)); }catch(e){} },
  watch(col, cb, since){
    if(this.fs){
      let q = this.fs.collection(col); if(since) q = q.where("data",">=",since);
      q.onSnapshot(snap => cb(snap.docs.map(d => Object.assign({id:d.id}, d.data()))), e => toast("Erro ao carregar "+col+": "+(e.code||e.message)));
    } else {
      this.subs[col] = cb; cb(Object.entries(this.local[col]||{}).map(([id,v]) => Object.assign({id}, v)));
    }
  },
  async set(col, id, data){
    const body = Object.assign({}, data); delete body.id;
    if(this.fs) return this.fs.collection(col).doc(id).set(body);
    (this.local[col] ||= {})[id] = body; this.saveLocal(); this.subs[col] && this.watch(col, this.subs[col]);
  },
  async update(col, id, patch){
    if(this.fs) return this.fs.collection(col).doc(id).set(patch, {merge:true});
    const cur = (this.local[col] ||= {})[id]; if(!cur) throw {code:"invalid_argument"};
    const merge = (x,y) => { for(const k in y){ if(y[k] && typeof y[k]==="object" && !Array.isArray(y[k]) && x[k] && typeof x[k]==="object") merge(x[k],y[k]); else x[k]=y[k]; } };
    merge(cur, patch); this.saveLocal(); this.subs[col] && this.watch(col, this.subs[col]);
  },
  async del(col, id){
    if(this.fs) return this.fs.collection(col).doc(id).delete();
    delete (this.local[col]||{})[id]; this.saveLocal(); this.subs[col] && this.watch(col, this.subs[col]);
  }
};
async function saveConfig(patch){
  S.config = Object.assign({}, S.config, patch);
  try{ await Store.set("config","geral",S.config); }catch(e){ toast(erroMsg(e)); }
}
function erroMsg(e){
  if(!e) return "Não foi possível salvar.";
  if(e.code==="invalid_argument" || e.code==="permission-denied") return "Sem permissão para salvar. Confira se seu e-mail está nas regras do Firebase.";
  if(e.code==="quota_exceeded") return "Espaço cheio. Apague registros antigos para continuar.";
  if(e.code==="resource_exhausted") return "Muitas gravações seguidas. Espere alguns segundos.";
  return "Não foi possível salvar ("+(e.code||"erro")+").";
}

// ---------- toast & modal ----------
let toastT;
function toast(t){ let el = $("#toast"); if(!el){ el = document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el);} el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2600); }
function openModal(html, onMount){
  const root = $("#modalRoot");
  root.innerHTML = '<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
  $("#ov").addEventListener("click", e => { if(e.target.id==="ov") closeModal(); });
  root.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);
  onMount && onMount(root);
  const first = root.querySelector("input,select,textarea,button"); first && first.focus();
}
function closeModal(){ $("#modalRoot").innerHTML=""; render(); }
document.addEventListener("keydown", e => { if(e.key==="Escape" && $("#ov")) closeModal(); });
async function copiar(text){
  try{ await navigator.clipboard.writeText(text); toast("Mensagem copiada. Cole no WhatsApp."); }
  catch(e){ const ta = $("#msgCopy"); if(ta){ ta.focus(); ta.select(); } toast("Selecione o texto e copie manualmente."); }
}

// ---------- derived ----------
const plano = id => S.planos.find(p => p.id===id);
const isOpen = d => S.config.abertos.includes(d);
const pedido = d => S.pedidos[d] || {data:d, confirmados:{}};
const confirmadosDia = d => Object.entries(pedido(d).confirmados||{}).filter(([id,v]) => v && v.qtd>0).map(([id,v]) => ({id, qtd:v.qtd, avulso:!!v.avulso, cliente:S.clientes.find(c=>c.id===id) || {id, nome:"(cliente apagado)"}}));
function usadas(c){
  if(!c.planoId) return 0; let n = 0;
  for(const d in S.pedidos){ if(c.inicio && d < c.inicio) continue; if(c.fim && d > c.fim) continue; const v = (S.pedidos[d].confirmados||{})[c.id]; if(v && v.qtd>0 && !v.avulso) n += v.qtd; }
  return n;
}
const saldo = c => (Number(c.marmitasContratadas)||0) - usadas(c);
function statusCliente(c){
  if(c.ativo===false) return {t:"Inativo",k:""};
  if(!c.planoId) return {t:"Avulso",k:""};
  if(c.fim && c.fim < today()) return {t:"Plano vencido",k:"bad"};
  const s = saldo(c), lim = Number(S.config.alertaSaldo)||0;
  if(c.marmitasContratadas && s <= 0) return {t:"Sem saldo",k:"bad"};
  if((c.marmitasContratadas && s <= lim) || (c.fim && c.fim <= addDays(today(), Number(S.config.alertaDias)||5))) return {t:"Acabando",k:"warn"};
  return {t:"Plano ativo",k:"ok"};
}
const enderecoTxt = c => [[c.rua, c.numero].filter(Boolean).join(", "), c.complemento, c.bairro].filter(Boolean).join(" - ");
function msgAlerta(c){
  return (S.config.msgAlerta||DEFAULT_CONFIG.msgAlerta).replace(/\{nome\}/g, (c.nome||"").split(" ")[0]).replace(/\{saldo\}/g, Math.max(0,saldo(c))).replace(/\{plano\}/g, plano(c.planoId)?.nome||"").replace(/\{fim\}/g, fmtDate(c.fim));
}
// one write at a time, in order, so a day's document is created before it is merged into
let wq = Promise.resolve();
const enqueue = fn => (wq = wq.then(fn).catch(e => toast(erroMsg(e))));
function setConf(d, c, qtd){
  const prev = (pedido(d).confirmados||{})[c.id];
  const avulso = prev && prev.qtd>0 ? !!prev.avulso : (!c.planoId || statusCliente(c).k==="bad");
  const entry = {qtd:Math.max(0,qtd), avulso, hora:new Date().toISOString()};
  const local = Object.assign({}, prev, entry);
  const existed = !!S.pedidos[d];
  S.pedidos[d] = Object.assign({data:d, enviado:false}, S.pedidos[d], {confirmados:Object.assign({}, pedido(d).confirmados, {[c.id]:local})});
  return enqueue(() => existed ? Store.update("pedidos", d, {confirmados:{[c.id]:entry}}) : Store.set("pedidos", d, S.pedidos[d]));
}
function setPedidoCampos(d, patch){
  const existed = !!S.pedidos[d];
  S.pedidos[d] = Object.assign({data:d, confirmados:{}}, S.pedidos[d], patch);
  return enqueue(() => existed ? Store.update("pedidos", d, patch) : Store.set("pedidos", d, S.pedidos[d]));
}
const csvCell = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
const toCsv = rows => rows.map(r => r.map(csvCell).join(";")).join("\r\n");
async function baixar(nome, csv){
  let dl = null; try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){}
  if(!dl){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"})); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Planilha baixada."); return; }
  try{ await dl.save({filename:nome, data:"\ufeff"+csv}); }catch(e){ if(e && e.code!=="declined") toast("Não foi possível baixar ("+(e.code||"erro")+")."); }
}
function menuText(dataIso){
  const c = S.cardapios[dataIso]; if(!c) return "";
  const d = parseIso(dataIso);
  let t = "🍱 *Cardápio de "+DOW_LONG[d.getDay()]+", "+pad(d.getDate())+"/"+pad(d.getMonth()+1)+"*";
  if(S.config.restaurante) t += "\n_"+S.config.restaurante+"_";
  t += "\n";
  CATEGORIAS.forEach(cat => {
    const its = (c.itens||[]).filter(i => i.cat===cat && i.nome);
    if(its.length){ t += "\n*"+cat+"*\n" + its.map(i=>"• "+i.nome).join("\n") + "\n"; }
  });
  if(c.preco) t += "\n💰 Marmita avulsa: "+brl(c.preco)+"\n";
  if(c.obs) t += "\n"+c.obs+"\n";
  t += "\nResponda *SIM* até as "+(S.config.horarioLimite||"10:30")+" para confirmar sua marmita.";
  return t;
}

// ----- Dia (passo a passo) -----
function confOrdenados(d){
  return confirmadosDia(d).sort((a,b) => (a.cliente.bairro||"~").localeCompare(b.cliente.bairro||"~","pt-BR") || (a.cliente.nome||"").localeCompare(b.cliente.nome||"","pt-BR"));
}
function planoHoje(d){
  const wd = parseIso(d).getDay(), conf = pedido(d).confirmados||{};
  return S.clientes.filter(c => c.ativo!==false && c.planoId && !(conf[c.id] && conf[c.id].qtd>0) && statusCliente(c).k!=="bad" && (plano(c.planoId)?.dias||[1,2,3,4,5]).includes(wd) && (!c.inicio || c.inicio<=d));
}
function listaEntrega(d){
  const conf = confOrdenados(d), tot = conf.reduce((s,x)=>s+x.qtd,0);
  let t = "🛵 *Entregas "+fmtDate(d)+"* — "+tot+" marmitas\n", bairro = null, i = 0;
  conf.forEach(x => {
    const c = x.cliente, b = c.bairro || "Sem bairro";
    if(b!==bairro){ bairro = b; t += "\n*"+b+"*\n"; }
    i++;
    t += i+". "+(c.nome||"")+" ("+x.qtd+")"+(x.avulso?" avulso":"")+"\n   "+(enderecoTxt(c)||"sem endereço")+(c.referencia?" · Ref: "+c.referencia:"")+"\n   "+fmtPhone(c.telefone)+(c.pagamento?" · "+c.pagamento:"")+(c.obs?"\n   Obs: "+c.obs:"")+"\n";
  });
  return t;
}
function csvDia(d){
  const rows = [["Bairro","Cliente","Telefone","Endereço","Referência","Quantidade","Tipo","Pagamento","Saldo do plano","Observações"]];
  confOrdenados(d).forEach(x => { const c = x.cliente; rows.push([c.bairro||"", c.nome||"", fmtPhone(c.telefone), enderecoTxt(c), c.referencia||"", x.qtd, x.avulso?"Avulso":"Plano", c.pagamento||"", c.planoId&&c.marmitasContratadas?saldo(c):"", c.obs||""]); });
  return toCsv(rows);
}

  </div></section>

  ${alertas.length ? `<section style="display:flex;flex-direction:column;gap:10px"><h2>Avisar sobre fim de plano</h2><p class="muted" style="margin:0">Planos com poucas marmitas, sem saldo ou vencidos. Copie o aviso e mande para o cliente.</p>

// ----- Clientes -----
function filtrados(){
  const q = S.busca.trim().toLowerCase(), qd = q.replace(/\D/g,"");
  return S.clientes.filter(c => {
    if(S.filtro!=="todos"){ const s = statusCliente(c); if(S.filtro==="ativo" && s.k!=="ok") return false; if(S.filtro==="alerta" && !["warn","bad"].includes(s.k)) return false; if(S.filtro==="avulso" && s.t!=="Avulso") return false; if(S.filtro==="inativo" && s.t!=="Inativo") return false; }
    if(!q) return true;
    return (c.nome||"").toLowerCase().includes(q) || (qd && (c.telefone||"").includes(qd)) || (c.bairro||"").toLowerCase().includes(q) || (c.rua||"").toLowerCase().includes(q);
  }).sort((a,b) => (a.nome||"").localeCompare(b.nome||"","pt-BR"));
}

// ----- Importação WhatsApp -----
const ADDR_RE = /\b(rua|r\.|av\.?|avenida|travessa|tv\.|alameda|al\.|estrada|rodovia|rod\.|pra[çc]a|largo|quadra|qd\.?|condom[ií]nio|cond\.|vila|bloco|apto|apartamento)\b[^\n]{3,}/i;
const PAG_RE = /\b(pix|dinheiro|esp[eé]cie|cart[aã]o|cr[eé]dito|d[eé]bito|vale[- ]refei[çc][aã]o|\bvr\b|boleto)\b/i;
const PHONE_RE = /(?:\+?55\s?)?\(?\d{2}\)?\s?9?\s?\d{4}[-\s]?\d{4}/g;
function pagFrom(t){
  const m = t.match(PAG_RE); if(!m) return "";
  const w = m[1].toLowerCase();
  if(w==="pix") return "Pix"; if(/dinheiro|esp/.test(w)) return "Dinheiro"; if(/d[eé]bito/.test(w)) return "Cartão de débito"; if(/cr[eé]dito|cart/.test(w)) return "Cartão de crédito"; if(/vale|vr/.test(w)) return "Vale-refeição"; if(/boleto/.test(w)) return "Boleto"; return "";
}
const LINE_A = /^(\d{1,2}\/\d{1,2}\/\d{2,4}),?\s(\d{1,2}:\d{2})(?::\d{2})?\s?(?:[ap]\.?\s?m\.?)?\s?[-–]\s([^:]{1,60}?):\s([\s\S]*)$/i;
const LINE_B = /^\[(\d{1,2}\/\d{1,2}\/\d{2,4}),?\s(\d{1,2}:\d{2}(?::\d{2})?)(?:\s?[ap]\.?\s?m\.?)?\]\s([^:]{1,60}?):\s([\s\S]*)$/i;
const looksPhone = s => /^[+\d\s()\-‪‬]{8,}$/.test(s) && s.replace(/\D/g,"").length>=10;
function parseTxt(text, fileName, ignore){
  const msgs = []; let cur = null;
  text.replace(/\r/g,"").replace(/[‎‏‪‬]/g,"").split("\n").forEach(line => {
    const m = line.match(LINE_A) || line.match(LINE_B);
    if(m){ cur = {from:m[3].trim(), text:m[4]}; msgs.push(cur); }
    else if(cur) cur.text += "\n"+line;
  });
  const bySender = {};
  msgs.forEach(m => { if(ignore && m.from.toLowerCase()===ignore.toLowerCase()) return; (bySender[m.from] ||= []).push(m.text); });
  let chatName = (fileName||"").replace(/\.txt$/i,"").replace(/^(conversa do whatsapp com|whatsapp chat with|chat de whatsapp con)\s*/i,"").trim();
  const senders = Object.keys(bySender);
  const out = [];
  senders.forEach(s => {
    const texts = bySender[s]; const all = texts.join("\n");
    let nome = "", tel = "";
    if(looksPhone(s)) tel = normPhone(s); else nome = s;
    if(!nome && senders.length===1 && chatName && !looksPhone(chatName)) nome = chatName;
    if(!tel){ const ph = (all.match(PHONE_RE)||[]).map(normPhone).filter(x=>x.length>=12); if(ph.length) tel = ph[ph.length-1]; }
    if(!tel && senders.length===1 && looksPhone(chatName)) tel = normPhone(chatName);
    let end = ""; for(let i=texts.length-1;i>=0;i--){ const a = texts[i].match(ADDR_RE); if(a){ end = texts[i].trim().slice(0,200); break; } }
    let pag = ""; for(let i=texts.length-1;i>=0 && !pag;i--){ pag = pagFrom(texts[i]); }
    out.push({nome, telefone:tel, endereco:end, pagamento:pag, origem:fileName, msgs:texts.length});
  });
  return out;
}
function parseVcf(text, fileName){
  return text.replace(/\r/g,"").split(/BEGIN:VCARD/i).slice(1).map(card => {
    const get = re => { const m = card.match(re); return m ? m[1].trim() : ""; };
    const nome = get(/\nFN[^:]*:(.*)/i) || get(/\nN[^:]*:(.*)/i).split(";").filter(Boolean).reverse().join(" ");
    const tel = normPhone(get(/\nTEL[^:]*:(.*)/i));
    const adr = get(/\nADR[^:]*:(.*)/i).split(";").filter(Boolean).join(", ");
    return {nome, telefone:tel, endereco:adr, pagamento:"", origem:fileName, msgs:0};
  }).filter(c => c.nome || c.telefone);
}
function parseCsv(text, fileName){
  const lines = text.replace(/\r/g,"").split("\n").filter(l=>l.trim()); if(lines.length<2) return [];
  const sep = (lines[0].match(/;/g)||[]).length > (lines[0].match(/,/g)||[]).length ? ";" : ",";
  const split = l => { const r=[]; let cur="", q=false; for(const ch of l){ if(ch==='"') q=!q; else if(ch===sep && !q){ r.push(cur); cur=""; } else cur+=ch; } r.push(cur); return r.map(x=>x.trim()); };
  const h = split(lines[0]).map(x=>x.toLowerCase());
  const idx = re => h.findIndex(x=>re.test(x));
  const iN=idx(/nome|name/), iT=idx(/tel|fone|celular|whats|phone/), iE=idx(/ender|rua|address/), iP=idx(/pag/);
  return lines.slice(1).map(l => { const c = split(l); return {nome:iN>=0?c[iN]:"", telefone:iT>=0?normPhone(c[iT]):"", endereco:iE>=0?c[iE]:"", pagamento:iP>=0?pagFrom(c[iP])||c[iP]:"", origem:fileName, msgs:0}; }).filter(c=>c.nome||c.telefone);
}
function splitEndereco(e){
  if(!e) return {};
  const m = e.match(/^(.*?(?:rua|r\.|av\.?|avenida|travessa|tv\.|alameda|estrada|rodovia|pra[çc]a)[^,\d]*?)[, ]+(?:n[ºo°.]?\s*)?(\d+[a-z]?)\b([\s\S]*)$/i);
  const bm = e.match(/bairro[:\s]+([^\n,.]+)/i); const bairro = bm ? bm[1].trim() : "";
  if(m) return {bairro, rua:m[1].replace(/^.*?(?=(rua|r\.|av|avenida|travessa|tv\.|alameda|estrada|rodovia|pra[çc]a))/i,"").trim(), numero:m[2], complemento:m[3].replace(/bairro[:\s]+[^\n,.]+/i,"").replace(/\s+/g," ").replace(/^[\s,\-–]+/,"").trim()};
  return {bairro, rua:e};
}
let IMP = [];
function importar(){
  openModal(`
    <h2>Importar clientes do WhatsApp</h2>
    <div class="muted" style="font-size:.92rem">
      <b>Como exportar no celular:</b> abra a conversa com o cliente, toque em ⋮ (ou no nome dele no iPhone), depois <b>Mais &gt; Exportar conversa &gt; Sem mídia</b> e salve o arquivo .txt. Repita para cada cliente ou exporte um grupo de clientes.
      Também aceito contatos em <b>.vcf</b> e planilhas em <b>.csv</b> (colunas nome, telefone, endereço, pagamento).
    </div>
    <div class="form">
      <label class="f c4">Arquivos (.txt, .vcf, .csv)<input type="file" id="files" multiple accept=".txt,.vcf,.csv,text/plain,text/vcard,text/csv"></label>
      <label class="f c2">Seu nome no WhatsApp (para ignorar)<input type="text" id="ign" value="${esc(S.config.meuNomeWhats)}" placeholder="Ex.: Marmitex da Ana"></label>
    </div>
    <div id="prev"></div>
    <div class="foot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="doImp" disabled>Importar selecionados</button></div>`,
  () => {
    $("#files").onchange = async e => {
      const ign = $("#ign").value.trim(); if(ign !== S.config.meuNomeWhats) saveConfig({meuNomeWhats:ign});
      let all = [];
      for(const f of e.target.files){
        const text = await f.text(); const n = f.name.toLowerCase();
        if(n.endsWith(".vcf")) all = all.concat(parseVcf(text,f.name));
        else if(n.endsWith(".csv")) all = all.concat(parseCsv(text,f.name));
        else all = all.concat(parseTxt(text,f.name,ign));
      }
      const map = new Map();
      all.forEach(c => {
        const k = c.telefone || ("nome:"+(c.nome||"").toLowerCase()); if(k==="nome:") return;
        const p = map.get(k); if(!p) map.set(k, c); else { ["nome","telefone","endereco","pagamento"].forEach(f => { if(!p[f] && c[f]) p[f]=c[f]; }); p.msgs += c.msgs; }
      });
      IMP = [...map.values()].map(c => { const ex = S.clientes.find(x => (c.telefone && x.telefone===c.telefone) || (!c.telefone && c.nome && (x.nome||"").toLowerCase()===c.nome.toLowerCase())); return Object.assign(c,{existe:!!ex, sel:true}); });
      const sem = IMP.filter(c=>!c.telefone).length;
      $("#prev").innerHTML = IMP.length ? `
        <p><b>${IMP.length}</b> contatos encontrados. ${IMP.filter(c=>c.existe).length} já cadastrados (só completo os campos vazios). ${sem?`<span class="pill warn">${sem} sem telefone</span>`:""}</p>
        <div class="tablebox" style="max-height:340px;overflow:auto"><table><thead><tr><th><input type="checkbox" id="selAll" checked aria-label="Selecionar todos"></th><th>Nome</th><th>Telefone</th><th>Endereço encontrado</th><th>Pagamento</th></tr></thead><tbody>
        ${IMP.map((c,i)=>`<tr><td><input type="checkbox" data-i="${i}" checked aria-label="Selecionar"></td><td>${esc(c.nome||"(sem nome)")} ${c.existe?'<span class="pill">já existe</span>':""}</td><td class="num">${fmtPhone(c.telefone)}</td><td>${esc(c.endereco||"—")}</td><td>${esc(c.pagamento||"—")}</td></tr>`).join("")}
        </tbody></table></div>` : `<p class="banner">Não encontrei contatos nesses arquivos. Confira se é a conversa exportada em .txt, sem mídia.</p>`;
      $("#doImp").disabled = !IMP.length;
      const sa = $("#selAll"); if(sa) sa.onchange = () => document.querySelectorAll("#prev [data-i]").forEach(cb => { cb.checked = sa.checked; IMP[cb.dataset.i].sel = sa.checked; });
      document.querySelectorAll("#prev [data-i]").forEach(cb => cb.onchange = () => IMP[cb.dataset.i].sel = cb.checked);
    };
    $("#doImp").onclick = async () => {
      const sel = IMP.filter(c=>c.sel); const btn = $("#doImp"); btn.disabled = true; let ok = 0;
      for(const c of sel){
        btn.textContent = "Importando "+(ok+1)+" de "+sel.length+"...";
        const ex = S.clientes.find(x => (c.telefone && x.telefone===c.telefone) || (!c.telefone && c.nome && (x.nome||"").toLowerCase()===c.nome.toLowerCase()));
        const end = splitEndereco(c.endereco);
        const novo = {nome:c.nome||fmtPhone(c.telefone), telefone:c.telefone, rua:end.rua||"", numero:end.numero||"", complemento:end.complemento||"", bairro:end.bairro||"", pagamento:c.pagamento||"", ativo:true, origem:"WhatsApp", atualizado:new Date().toISOString()};
        let data = novo, id = c.telefone || uid();
        if(ex){ id = ex.id; data = Object.assign({}, ex); Object.keys(novo).forEach(k => { if(!data[k] && novo[k]) data[k] = novo[k]; }); }
        try{ await Store.set("clientes", id, data); ok++; }catch(e){ toast(erroMsg(e)); break; }
      }
      closeModal(); toast(ok+" clientes importados.");
    };
  });
}

function loadDraft(){ const c = S.cardapios[S.cardData]; draft = c ? structuredClone(c) : {itens:[{nome:"",cat:"Prato principal"},{nome:"",cat:"Guarnição"},{nome:"",cat:"Salada"}], preco:"", obs:""}; draft.itens = draft.itens||[]; }
VIEWS.cardapio = () => {
  if(!draft || draft._d!==S.cardData){ loadDraft(); draft._d = S.cardData; }
  const d = parseIso(S.cardData), salvo = !!S.cardapios[S.cardData];

  return `
  <div class="head"><div><h1>Cardápio</h1><p>${DOW_LONG[d.getDay()]}, ${fmtDate(S.cardData)} ${isOpen(S.cardData)?'<span class="pill ok">aberto</span>':'<span class="pill warn">dia marcado como fechado</span>'} ${salvo?'<span class="pill ok">salvo</span>':""}</p></div>

      <div class="form"><label class="f c2">Preço avulso (R$)<input type="number" step="0.01" min="0" id="cPreco" value="${esc(draft.preco)}"></label><label class="f c4">Observação<input type="text" id="cObs" value="${esc(draft.obs)}" placeholder="Ex.: Feijoada só até acabar"></label></div>
      <div class="row">${salvo?'<button class="btn danger" id="cDel">Apagar</button>':""}<span style="flex:1"></span><button class="btn primary" id="cSave">Salvar cardápio</button></div>
    </section>
    <section class="panel" style="display:flex;flex-direction:column;gap:12px">
      <h2>Mensagem para o WhatsApp</h2>

      <div class="row"><button class="btn primary" id="cCopy">Copiar mensagem</button><span class="muted" style="font-size:.85rem">Cole na lista de transmissão ou no status. O envio automático chega no passo 3.</span></div>
    </section>
  </div>`;
};
function syncDraft(){
  document.querySelectorAll("[data-n]").forEach(el => draft.itens[el.dataset.n].nome = el.value);
  document.querySelectorAll("[data-c]").forEach(el => draft.itens[el.dataset.c].cat = el.value);
  draft.preco = $("#cPreco").value; draft.obs = $("#cObs").value;
}
function previewMsg(){
  const tmp = S.cardapios[S.cardData]; S.cardapios[S.cardData] = {itens:draft.itens, preco:Number(draft.preco)||0, obs:draft.obs};
  const t = menuText(S.cardData); if(tmp) S.cardapios[S.cardData] = tmp; else delete S.cardapios[S.cardData];
  $("#msgPrev").textContent = t; $("#msgCopy").value = t; return t;
}
BIND.cardapio = () => {
  const setDate = v => { if(!v) return; S.cardData = v; render(); };
  $("#cDate").onchange = e => setDate(e.target.value);
  $("#prevD").onclick = () => setDate(addDays(S.cardData,-1));
  $("#nextD").onclick = () => setDate(addDays(S.cardData,1));
  $("#itens").oninput = () => { syncDraft(); previewMsg(); };
  $("#itens").onchange = () => { syncDraft(); previewMsg(); };
  $("#cPreco").oninput = $("#cObs").oninput = () => { syncDraft(); previewMsg(); };
  $("#itens").onclick = e => { const r = e.target.closest("[data-r]"); if(r){ syncDraft(); draft.itens.splice(Number(r.dataset.r),1); render(); } };
  $("#addIt").onclick = () => { syncDraft(); draft.itens.push({nome:"",cat:"Prato principal"}); render(); const ins = document.querySelectorAll("[data-n]"); ins[ins.length-1].focus(); };
  const cf = $("#copyFrom"); if(cf) cf.onchange = () => { const src = S.cardapios[cf.value]; if(src){ draft = Object.assign(structuredClone(src),{_d:S.cardData}); render(); toast("Cardápio copiado. Revise e salve."); } };
  $("#cCopy").onclick = () => { syncDraft(); copiar(previewMsg()); };
  $("#cSave").onclick = async () => {
    syncDraft(); const itens = draft.itens.filter(i=>i.nome.trim()).map(i=>({nome:i.nome.trim(),cat:i.cat}));
    if(!itens.length){ toast("Adicione pelo menos um prato."); return; }
    try{
      await Store.set("cardapios", S.cardData, {data:S.cardData, itens, preco:Number(draft.preco)||0, obs:draft.obs.trim(), atualizado:new Date().toISOString()});
      if(!isOpen(S.cardData)) await saveConfig({abertos:[...S.config.abertos, S.cardData].sort()});
      draft = null; toast("Cardápio salvo.");
    }catch(e){ toast(erroMsg(e)); }
  };
  const del = $("#cDel"); if(del) del.onclick = () => { if(del.dataset.sure){ Store.del("cardapios",S.cardData).then(()=>{draft=null;toast("Cardápio apagado.");}).catch(e=>toast(erroMsg(e))); } else { del.dataset.sure="1"; del.textContent="Toque de novo para apagar"; } };
  previewMsg();
};

// ----- Relatórios -----
function periodo(){
  const t = today();
  if(S.relPeriodo==="hoje") return [t,t];
  if(S.relPeriodo==="7") return [addDays(t,-6),t];
  if(S.relPeriodo==="30") return [addDays(t,-29),t];
  if(S.relPeriodo==="mes") return [t.slice(0,8)+"01",t];
  const d = parseIso(t.slice(0,8)+"01"); d.setDate(0); const fim = iso(d); return [fim.slice(0,8)+"01",fim];
}
function dadosRel(){
  const [ini,fim] = periodo();
  const dias = Object.keys(S.pedidos).filter(d => d>=ini && d<=fim).sort();
  const porDia = dias.map(d => { const c = confirmadosDia(d); const pl = c.filter(x=>!x.avulso).reduce((s,x)=>s+x.qtd,0), av = c.filter(x=>x.avulso).reduce((s,x)=>s+x.qtd,0); return {d, cli:c.length, pl, av, rec:av*(Number(S.cardapios[d] && S.cardapios[d].preco)||0)}; }).filter(x => x.pl+x.av>0);
  const porCli = {};
  S.clientes.filter(c => c.ativo!==false && c.planoId).forEach(c => porCli[c.id] = {c, pl:0, av:0, dias:0});
  dias.forEach(d => confirmadosDia(d).forEach(x => { const o = porCli[x.id] ||= {c:x.cliente, pl:0, av:0, dias:0}; o.dias++; if(x.avulso) o.av += x.qtd; else o.pl += x.qtd; }));
  let cli = Object.values(porCli);
  if(S.relTipo==="plano") cli = cli.filter(o => o.c.planoId);
  if(S.relTipo==="avulso") cli = cli.filter(o => !o.c.planoId || o.av>0);
  cli.sort((a,b) => (b.pl+b.av)-(a.pl+a.av) || (a.c.nome||"").localeCompare(b.c.nome||"","pt-BR"));
  return {ini, fim, porDia, cli};
}

// ----- Confirmação em lote pelas respostas do WhatsApp -----
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
function acharCliente(s){
  const dg = String(s||"").replace(/\D/g,"");
  if(dg.length>=8){ const fim = dg.slice(-8); const c = S.clientes.find(c => (c.telefone||"").endsWith(fim)); if(c) return c; }
  const n = norm(s); if(n.length<3) return null;
  let best = null;
  S.clientes.forEach(c => { const cn = norm(c.nome); if(cn.length>=3 && (n===cn || n.includes(cn) || (n.length>=5 && cn.startsWith(n)))){ if(!best || cn.length>norm(best.nome).length) best = c; } });
  return best;
}
function parseRespostas(txt){
  const res = new Map(), semCliente = [];
  txt.replace(/\r/g,"").replace(/[‎‏‪‬]/g,"").split("\n").forEach(raw => {
    const line = raw.trim(); if(!line) return;
    const m = line.match(/^\[[^\]]{4,30}\]\s*([^:]{1,60}):\s*(.*)$/) || line.match(/^\d{1,2}\/\d{1,2}\/\d{2,4},?\s\d{1,2}:\d{2}\s?[-–]\s([^:]{1,60}):\s*(.*)$/);
    const who = m ? m[1].trim() : line, msg = m ? m[2] : line;
    if(m && S.config.meuNomeWhats && norm(who)===norm(S.config.meuNomeWhats)) return;
    const tel = !m && (line.match(PHONE_RE)||[])[0];
    const c = (tel && acharCliente(tel)) || acharCliente(m ? who : line.replace(/\bx\s*\d{1,2}\b|\d{1,2}\s*(marm\w*|x\b|unid\w*)/gi,"")) || (m ? acharCliente(msg) : null);
    if(!c){ semCliente.push(line); return; }
    const neg = /\b(n[aã]o|cancel\w*|hoje n)/i.test(msg) && !/\bn[aã]o tem\b/i.test(msg);
    let qm = msg.match(/(\d{1,2})\s*(?:marm|x\b|unid|quent)/i) || msg.match(/\bx\s*(\d{1,2})\b/i) || (m ? msg.match(/^\s*(\d{1,2})\s*$/) || msg.match(/\b(?:quero|manda|mande|confirmo|sim)\D{0,6}(\d{1,2})\b/i) : null);
    const padrao = plano(c.planoId)?.porDia || 1;
    const prev = res.get(c.id);
    res.set(c.id, {c, qtd: qm ? Number(qm[1]) : (prev ? prev.qtd : padrao), neg: prev ? (prev.neg && neg) || (!prev.neg && neg && !!m) : neg, linha: line});
  });
  return {lista:[...res.values()], semCliente};
}

        ${R.lista.map((r,i)=>`<tr><td><input type="checkbox" data-ri="${i}" ${r.neg?"":"checked"} aria-label="Confirmar"></td><td><b>${esc(r.c.nome)}</b>${conf[r.c.id]&&conf[r.c.id].qtd>0?' <span class="pill ok">já confirmado</span>':""}${r.neg?' <span class="pill bad">disse não</span>':""}<div class="muted" style="font-size:.8rem">${fmtPhone(r.c.telefone)}</div></td><td style="font-size:.85rem">${esc(r.linha.slice(0,120))}</td><td><input type="number" min="1" max="50" data-rq="${i}" value="${r.qtd}" style="width:64px" aria-label="Quantidade"></td></tr>`).join("")}
        </tbody></table></div>` : "") +
        (R.semCliente.length ? `<p class="muted" style="font-size:.85rem">Não encontrei cliente para ${R.semCliente.length} linha(s): ${esc(R.semCliente.slice(0,4).join(" · ").slice(0,200))}${R.semCliente.length>4?"…":""}. Cadastre o cliente ou confira o nome.</p>` : "");
      $("#respOk").disabled = !R.lista.length;

    $("#respTxt").oninput = () => { clearTimeout(t); t = setTimeout(show, 300); };
    $("#respOk").onclick = () => {

      closeModal(); toast(n+" pedidos confirmados.");
    };
  });

// ----- Entregas -----
const entregador = id => S.entregadores.find(e => e.id===id);
const enderecoMapa = c => [[c.rua, c.numero].filter(Boolean).join(", "), c.bairro, c.cidade || S.config.cidade].filter(Boolean).join(", ");
function patchConf(d, patch){
  const p = S.pedidos[d]; if(!p) return;
  const c = Object.assign({}, p.confirmados); for(const id in patch) c[id] = Object.assign({}, c[id], patch[id]);
  S.pedidos[d] = Object.assign({}, p, {confirmados:c});
  return enqueue(() => Store.update("pedidos", d, {confirmados:patch}));
}
function rotasDia(d){
  const pc = pedido(d).confirmados||{};
  const by = {}; S.entregadores.forEach(e => by[e.id] = []); by[""] = [];
  confirmadosDia(d).forEach(x => { const e = (pc[x.id]||{}).entregador; x.ordem = (pc[x.id]||{}).ordem ?? 9999; (by[entregador(e) ? e : ""]).push(x); });

function distribuir(d, refazer){
  const ents = S.entregadores.filter(e => e.ativo!==false);
  if(!ents.length){ toast("Cadastre pelo menos um entregador."); return; }
  const pc = pedido(d).confirmados||{}, conf = confirmadosDia(d), carga = {};
  ents.forEach(e => carga[e.id] = 0);
  if(!refazer) conf.forEach(x => { const e = (pc[x.id]||{}).entregador; if(e in carga) carga[e] += x.qtd; });
  const pend = conf.filter(x => refazer || !((pc[x.id]||{}).entregador in carga));
  if(!pend.length && !refazer){ toast("Todas as entregas já têm entregador."); return; }
  const grupos = {}; pend.forEach(x => (grupos[norm(x.cliente.bairro)] ||= []).push(x));
  const dono = {};
  Object.entries(grupos).sort((a,b) => b[1].length-a[1].length).forEach(([b,l]) => {
    let e = b && ents.find(e => String(e.bairros||"").split(",").map(norm).filter(Boolean).includes(b));
    if(!e) e = ents.slice().sort((a,c) => carga[a.id]-carga[c.id])[0];
    carga[e.id] += l.reduce((s,x)=>s+x.qtd,0); l.forEach(x => dono[x.id] = e.id);
  });
  const patch = {}, final = {};
  conf.forEach(x => { const e = dono[x.id] || (pc[x.id]||{}).entregador; (final[e] ||= []).push(x); });
  Object.values(final).forEach(l => {
    l.sort((a,b) => norm(a.cliente.bairro).localeCompare(norm(b.cliente.bairro)) || norm(a.cliente.rua).localeCompare(norm(b.cliente.rua)) || (parseInt(a.cliente.numero)||0)-(parseInt(b.cliente.numero)||0));
    l.forEach((x,i) => patch[x.id] = {entregador: dono[x.id] || (pc[x.id]||{}).entregador, ordem:i});
  });
  patchConf(d, patch); render(); toast("Entregas distribuídas.");
}
function moverParada(d, eid, id, dir){
  const l = rotasDia(d)[eid] || []; const i = l.findIndex(x => x.id===id), j = i+dir;
  if(i<0 || j<0 || j>=l.length) return;
  [l[i], l[j]] = [l[j], l[i]];
  const patch = {}; l.forEach((x,k) => patch[x.id] = {ordem:k});
  patchConf(d, patch); render();
}
function mapsLinks(lista){

  const variavel = l.filter(x=>CAT_VAR.includes(x.cat)).reduce((s,x)=>s+x.valor,0), fixo = l.filter(x=>!CAT_VAR.includes(x.cat)).reduce((s,x)=>s+x.valor,0);

function previsao(){
  const t = today(), c = custos();
  const dias = []; for(let i=1;i<=30;i++){ const d = addDays(t,i); if(isOpen(d)) dias.push(d); }
  const diasAbertos = dias.length || 22;
  const hist = Object.keys(S.pedidos).filter(d => d<=t && d>=addDays(t,-28)).map(d => marmitasEntre(d,d)).filter(x=>x.n>0);
  const mediaDia = hist.length ? hist.reduce((s,x)=>s+x.n,0)/hist.length : 0;
  const mediaAv = hist.length ? hist.reduce((s,x)=>s+x.av,0)/hist.length : 0;
  const precos = Object.values(S.cardapios).filter(x=>x.preco).sort((a,b)=>String(b.data).localeCompare(String(a.data))).slice(0,10).map(x=>Number(x.preco));
  const precoAv = precos.length ? precos.reduce((s,x)=>s+x,0)/precos.length : 0;
  const ativosPlano = S.clientes.filter(x => x.ativo!==false && x.planoId && statusCliente(x).k!=="bad");
  const renov = S.clientes.filter(x => x.ativo!==false && x.planoId && x.fim && x.fim>=t && x.fim<=addDays(t,30)).reduce((s,x)=>s+(Number(plano(x.planoId)?.preco)||0),0);
  const saldoTotal = ativosPlano.reduce((s,x)=>s+Math.max(0, x.marmitasContratadas?saldo(x):0),0);
  const marmitasPrev = Math.round(mediaDia*diasAbertos);
  const recAv = mediaAv*diasAbertos*precoAv;
  const receita = renov + recAv, despesa = marmitasPrev*c.porMarmita + c.fixoMes;
  const valores = ativosPlano.map(x => { const p = plano(x.planoId); return p && p.marmitas ? p.preco/p.marmitas : 0; }).filter(Boolean);
  const precoMedio = valores.length ? valores.reduce((s,x)=>s+x,0)/valores.length : precoAv;
  const margemUn = precoMedio - c.porMarmita;
  return {c, diasAbertos, diasDoCalendario:dias.length>0, mediaDia, mediaAv, precoAv, renov, recAv, receita, despesa, lucro:receita-despesa, marmitasPrev, saldoTotal, custoPlanos:saldoTotal*c.porMarmita, precoMedio, margemUn, equilibrio: margemUn>0 ? Math.ceil(c.fixoMes/margemUn) : null};
}

function ultimoPedido(c){ let u = ""; for(const d in S.pedidos){ const v = (S.pedidos[d].confirmados||{})[c.id]; if(v && v.qtd>0 && d>u) u = d; } return u; }

function oportunidades(){
  const t = today(), ini = addDays(t,-30);
  const avFreq = S.clientes.filter(c => c.ativo!==false).map(c => { let n = 0; for(const d in S.pedidos){ if(d<ini) continue; const v = (S.pedidos[d].confirmados||{})[c.id]; if(v && v.qtd>0 && v.avulso) n++; } return {c, n}; }).filter(x => x.n>=3 && !x.c.planoId).sort((a,b)=>b.n-a.n);
  const sumidos = S.clientes.filter(c => c.ativo!==false && c.telefone).map(c => ({c, u:ultimoPedido(c)})).filter(x => !x.u || x.u < addDays(t,-21)).filter(x => !(x.c.planoId && statusCliente(x.c).k==="ok"));
  const ind = {}; S.clientes.forEach(c => { if(c.indicadoPor) (ind[c.indicadoPor] ||= []).push(c); });

  return {avFreq, sumidos, ranking};
}

      const card = S.cardapios[today()] ? (S.cardapios[today()].itens||[]).map(i=>i.nome).join(", ") : "";
      try{
        await sample("Escreva um texto de marketing em português do Brasil para um restaurante de marmitas caseiras chamado \""+(S.config.restaurante||"nosso restaurante")+"\".\nObjetivo: "+obj+".\nOnde será publicado: "+canal+".\n"+(det?"Destaque pedido pelo dono: "+det+".\n":"")+(planos?"Planos: "+planos+".\n":"")+(card?"Cardápio de hoje: "+card+".\n":"")+(S.config.premioIndicacao?"Prêmio de indicação: "+S.config.premioIndicacao+".\n":"")+"Regras: tom simpático e direto, frases curtas, no máximo 90 palavras, termine com uma chamada para pedir pelo WhatsApp. Para Instagram, inclua até 6 hashtags no final. Responda só com o texto, sem comentários.", {onText:({text}) => { out.textContent = text; }, cache:false});
      }catch(e){ out.textContent = (e && e.text) || iaErro(e) || base(); }
      b.disabled = false;
    };
  });
};

// ----- Ajustes -----
VIEWS.ajustes = () => `
  <div class="head"><div><h1>Ajustes</h1><p>Ligue só os módulos que você usa. Os desligados somem do menu.</p></div></div>
  <section class="panel" style="display:flex;flex-direction:column;gap:12px"><h2>Restaurante</h2>
    <div class="form">
      <label class="f c3">Nome do restaurante<input type="text" id="a_nome" value="${esc(S.config.restaurante)}"></label>
      <label class="f c3">Seu nome no WhatsApp<input type="text" id="a_wa" value="${esc(S.config.meuNomeWhats)}"></label>
      <label class="f c2">Horário limite para pedidos<input type="text" id="a_hora" value="${esc(S.config.horarioLimite)}" placeholder="10:30"></label>
      <label class="f c4">Endereço do restaurante (saída das rotas)<input type="text" id="a_end" value="${esc(S.config.enderecoRestaurante)}" placeholder="Rua, número, bairro, cidade"></label>
      <label class="f c2">Cidade<input type="text" id="a_cid" value="${esc(S.config.cidade)}"></label>
      <label class="f c2">Telefone do restaurante (WhatsApp)<input type="tel" id="a_tel" value="${esc(S.config.telefoneRestaurante)}"></label>
      <label class="f c2">Custo por marmita (R$)<input type="number" step="0.01" min="0" id="a_custo" value="${esc(S.config.custoMarmita||"")}" placeholder="Calculado das despesas"></label>
      <label class="f c2">Custos fixos por mês (R$)<input type="number" step="0.01" min="0" id="a_fixo" value="${esc(S.config.custoFixoMensal||"")}" placeholder="Calculado das despesas"></label>
      <label class="f c6">Prêmio por indicação<input type="text" id="a_premio" value="${esc(S.config.premioIndicacao)}"></label>
      <label class="f c2">Avisar quando restarem (marmitas)<input type="number" min="0" id="a_alerta" value="${esc(S.config.alertaSaldo)}"></label>
      <label class="f c2">Ou quando o plano acabar em (dias)<input type="number" min="0" id="a_alertaDias" value="${esc(S.config.alertaDias)}"></label>
      <label class="f c6">Mensagem de aviso de fim de plano<textarea id="a_msg">${esc(S.config.msgAlerta)}</textarea><span style="font-weight:400">Use {nome}, {saldo}, {plano} e {fim}.</span></label>
    </div>
    <div class="row"><button class="btn primary" id="a_save">Salvar</button></div>
  </section>
  <section class="panel" style="display:flex;flex-direction:column;gap:12px"><h2>Módulos</h2>
    <div class="mods">${MODULOS.filter(m=>!m.fixo).map(m=>`<div class="mod"><div><b>${esc(m.nome)}</b> ${m.breve?'<span class="pill">em breve</span>':""}<p>${esc(m.desc)}</p></div><input type="checkbox" data-m="${m.id}" ${m.breve?"disabled":""} ${!m.breve && S.config.modulos[m.id]!==false?"checked":""} aria-label="Ligar ${esc(m.nome)}" style="width:22px;height:22px"></div>`).join("")}</div>
  </section>
  <p class="muted" style="font-size:.85rem">${S.mode==="cloud"?"Os dados ficam salvos no seu Firebase e aparecem iguais no celular e no computador.":"Modo de teste: dados só neste navegador."}</p>
  ${window.__auth?`<div class="row"><span class="muted">Conectado como ${esc((window.__auth.currentUser||{}).email||"")}</span><button class="btn small" id="sairBtn">Sair</button></div>`:""}`;
BIND.ajustes = () => {
  $("#a_save").onclick = () => { saveConfig({restaurante:$("#a_nome").value.trim(), meuNomeWhats:$("#a_wa").value.trim(), horarioLimite:$("#a_hora").value.trim()||"10:30", enderecoRestaurante:$("#a_end").value.trim(), cidade:$("#a_cid").value.trim(), telefoneRestaurante:$("#a_tel").value.trim(), custoMarmita:Number($("#a_custo").value)||0, custoFixoMensal:Number($("#a_fixo").value)||0, premioIndicacao:$("#a_premio").value.trim()||"1 marmita grátis", alertaSaldo:Number($("#a_alerta").value)||0, alertaDias:Number($("#a_alertaDias").value)||0, msgAlerta:$("#a_msg").value.trim()||DEFAULT_CONFIG.msgAlerta}).then(()=>{ render(); toast("Ajustes salvos."); }); };
  document.querySelectorAll("[data-m]").forEach(cb => cb.onchange = () => { saveConfig({modulos:Object.assign({}, S.config.modulos, {[cb.dataset.m]:cb.checked})}); render(); });
};

// ---------- boot ----------
function rerenderSafe(){
  // keep an open modal and typed input intact; only re-render the page behind it
  if($("#ov")) { renderNav(); return; }
  if(S.tab==="hoje" && document.activeElement && document.activeElement.id==="confBusca"){ renderConfirmados(); renderBuscaConf(); return; }
  const a = document.activeElement; if(a && a.closest && a.closest("#view") && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type!=="checkbox") return;
  render();
}
async function boot(){
  const h = (location.hash||"").slice(1); if(MODULOS.some(m=>m.id===h)) S.tab = h;
  render();
  await Store.init();
  Store.watch("clientes", docs => { S.clientes = docs; rerenderSafe(); });
  Store.watch("planos", docs => { S.planos = docs; rerenderSafe(); });
  Store.watch("cardapios", docs => { S.cardapios = Object.fromEntries(docs.map(d=>[d.id,d])); rerenderSafe(); });
  Store.watch("pedidos", docs => { S.pedidos = Object.fromEntries(docs.map(d=>[d.id,d])); rerenderSafe(); }, addDays(today(),-150));
  Store.watch("financeiro", docs => { S.fin = Object.fromEntries(docs.map(d=>[d.id,d])); rerenderSafe(); }, addDays(today(),-400));
  Store.watch("entregadores", docs => { S.entregadores = docs; rerenderSafe(); });
  Store.watch("config", docs => { const g = docs.find(d=>d.id==="geral"); S.config = Object.assign(structuredClone(DEFAULT_CONFIG), g||{}); S.config.modulos = Object.assign({}, DEFAULT_CONFIG.modulos, (g&&g.modulos)||{}); delete S.config.id; rerenderSafe(); });
  render();
}
window.__startApp = boot;
})();
</script>

<div id="gate" class="overlay" style="background:var(--bg);align-items:center">
  <div class="modal gbox" style="max-width:420px"><p class="muted">Carregando...</p></div>
</div>
<script>
(function(){
"use strict";
// Depois de criar o projeto no Firebase, você pode colar a configuração aqui
// para não precisar colar em cada aparelho. Exemplo: const FIREBASE_CONFIG = {apiKey:"...", authDomain:"...", projectId:"...", appId:"..."};
const FIREBASE_CONFIG = null;

const gate = document.getElementById("gate"), box = gate.querySelector(".gbox");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let started = false;
function getCfg(){
  if(FIREBASE_CONFIG) return FIREBASE_CONFIG;
  try{ return JSON.parse(localStorage.getItem("marmitex-fb")||"null"); }catch(e){ return null; }
}
function parseCfg(t){
  const o = {}; String(t).replace(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g, (m,k,v) => { o[k] = v; });
  return o.apiKey && o.projectId ? o : null;
}
function show(html){ gate.hidden = false; box.innerHTML = html; const f = box.querySelector("input,textarea"); f && f.focus(); }
function setupScreen(msg){
  show(`<h2>Configurar o Marmitex</h2>
    <p class="muted" style="margin:0">No Firebase, abra <b>Configurações do projeto &gt; Seus apps</b>, copie o bloco <b>firebaseConfig</b> e cole aqui. Isso é feito uma vez em cada aparelho.</p>
    <label class="f">Configuração do Firebase<textarea id="g_cfg" style="min-height:160px" placeholder='const firebaseConfig = {&#10;  apiKey: "AIza...",&#10;  authDomain: "marmitex-xxxx.firebaseapp.com",&#10;  projectId: "marmitex-xxxx",&#10;  ...&#10;};'></textarea></label>
    <p id="g_err" style="color:var(--bad);margin:0">${esc(msg||"")}</p>
    <div class="foot"><button class="btn" id="g_test">Usar sem Firebase (teste)</button><button class="btn primary" id="g_save">Salvar</button></div>`);
  document.getElementById("g_save").onclick = () => {
    const cfg = parseCfg(document.getElementById("g_cfg").value);
    if(!cfg){ document.getElementById("g_err").textContent = "Não reconheci a configuração. Copie o bloco inteiro, com apiKey e projectId."; return; }
    try{ localStorage.setItem("marmitex-fb", JSON.stringify(cfg)); }catch(e){}
    location.reload();
  };
  document.getElementById("g_test").onclick = () => { gate.hidden = true; if(!started){ started = true; window.__startApp(); } };
}
const AUTH_ERR = {
  "auth/invalid-credential":"E-mail ou senha incorretos.", "auth/wrong-password":"E-mail ou senha incorretos.", "auth/user-not-found":"E-mail ou senha incorretos.",
  "auth/invalid-email":"Esse e-mail não é válido.", "auth/email-already-in-use":"Esse e-mail já tem acesso. Use Entrar.",
  "auth/weak-password":"A senha precisa ter pelo menos 6 caracteres.", "auth/too-many-requests":"Muitas tentativas. Espere alguns minutos.",
  "auth/operation-not-allowed":"Ative o login por E-mail/senha no Firebase (Authentication > Método de login).",
  "auth/network-request-failed":"Sem internet. Confira a conexão.", "auth/unauthorized-domain":"Adicione este endereço em Authentication > Configurações > Domínios autorizados."
};
function loginScreen(msg){
  show(`<h2>Marmitex Gestão</h2>
    <p class="muted" style="margin:0">Entre com seu e-mail e senha.</p>
    <form id="g_form" class="form" style="grid-template-columns:1fr">
      <label class="f">E-mail<input type="text" id="g_email" autocomplete="username" inputmode="email"></label>
      <label class="f">Senha<input type="password" id="g_pass" autocomplete="current-password"></label>
    </form>
    <p id="g_err" style="color:var(--bad);margin:0">${esc(msg||"")}</p>
    <div class="foot" style="justify-content:space-between"><button class="btn small" id="g_reset">Esqueci a senha</button><span style="flex:1"></span><button class="btn" id="g_new">Criar acesso</button><button class="btn primary" id="g_in">Entrar</button></div>
    <p class="muted" style="font-size:.8rem;margin:0">Primeira vez? Digite e-mail e uma senha e toque em Criar acesso. <button class="btn small" id="g_cfgchg" style="margin-left:4px">Trocar configuração</button></p>`);
  const em = () => document.getElementById("g_email").value.trim(), pw = () => document.getElementById("g_pass").value;
  const err = e => { document.getElementById("g_err").textContent = AUTH_ERR[e && e.code] || ("Não foi possível entrar ("+((e && e.code)||"erro")+")."); };
  const auth = firebase.auth();
  document.getElementById("g_in").onclick = () => auth.signInWithEmailAndPassword(em(), pw()).catch(err);
  document.getElementById("g_form").onsubmit = e => { e.preventDefault(); auth.signInWithEmailAndPassword(em(), pw()).catch(err); };
  document.getElementById("g_pass").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); auth.signInWithEmailAndPassword(em(), pw()).catch(err); } };
  document.getElementById("g_new").onclick = () => auth.createUserWithEmailAndPassword(em(), pw()).catch(err);
  document.getElementById("g_reset").onclick = () => { if(!em()){ document.getElementById("g_err").textContent = "Digite seu e-mail primeiro."; return; } auth.sendPasswordResetEmail(em()).then(() => { document.getElementById("g_err").textContent = "Enviamos um e-mail para trocar a senha."; }).catch(err); };
  document.getElementById("g_cfgchg").onclick = () => { if(FIREBASE_CONFIG) return; try{ localStorage.removeItem("marmitex-fb"); }catch(e){} location.reload(); };
}
function start(){
  const cfg = getCfg();
  if(!cfg) return setupScreen();
  if(!window.firebase){ show(`<h2>Sem conexão</h2><p class="muted">Não consegui carregar o sistema. Confira a internet e abra de novo.</p><div class="foot"><button class="btn primary" onclick="location.reload()">Tentar de novo</button></div>`); return; }
  try{ firebase.initializeApp(cfg); }catch(e){ return setupScreen("Configuração inválida: "+e.message); }
  const fs = firebase.firestore();
  try{ fs.settings({ignoreUndefinedProperties:true, merge:true}); }catch(e){}
  fs.enablePersistence({synchronizeTabs:true}).catch(() => {});
  firebase.auth().onAuthStateChanged(u => {
    if(u){
      gate.hidden = true; window.__fs = fs; window.__auth = firebase.auth();
      if(!started){ started = true; window.__startApp(); }
    } else {
      if(started){ location.reload(); return; }
      loginScreen();
    }
  });
}
document.addEventListener("click", e => { if(e.target && e.target.id==="sairBtn" && window.__auth) window.__auth.signOut(); });
start();
})();
</script>
