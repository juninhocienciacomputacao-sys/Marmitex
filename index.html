.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}

.msg{white-space:pre-wrap;background:var(--surface2);border-radius:8px;padding:12px;font-size:.92rem;max-height:340px;overflow:auto}
.mods{display:grid;gap:8px}
.mod{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:10px 12px}

.menu-list{margin:6px 0 0;padding-left:18px}

.step{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}

.step.done .sn{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.sb{min-width:0;display:flex;flex-direction:column;gap:8px}
.sb p{margin:0;color:var(--muted);font-size:.9rem}

.res div{min-width:0}
.bar{height:8px;border-radius:4px;background:var(--brand);display:inline-block;vertical-align:middle}
.bar.av{background:var(--accent)}
a.btn{text-decoration:none;color:inherit;display:inline-block}
a.btn.primary{color:var(--brand-fg)}
@media (max-width:760px){

  .item{grid-template-columns:1fr auto}
  .item select{grid-column:1/2}
  h1{font-size:1.4rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const Store = {
  fs:null, local:null, subs:{},
  async init(){
    this.fs = window.__fs || null;
    if(this.fs){ S.mode = "cloud"; return; }
    S.mode = "local";
    try{ this.local = JSON.parse(localStorage.getItem("marmitex-local")||"null"); }catch(e){}
    if(!this.local) this.local = {clientes:{},planos:{},cardapios:{},config:{}};
  },
  saveLocal(){ try{ localStorage.setItem("marmitex-local", JSON.stringify(this.local)); }catch(e){} },
  watch(col, cb, since){
    if(this.fs){
      let q = this.fs.collection(col); if(since) q = q.where("data",">=",since);
      q.onSnapshot({includeMetadataChanges:true}, snap => cb(snap.docs.map(d => Object.assign({id:d.id}, d.data())), snap.metadata), e => avisoPermissao(col, e));
    } else {
      this.subs[col] = cb; cb(Object.entries(this.local[col]||{}).map(([id,v]) => Object.assign({id}, v)), {fromCache:false});
    }
  },
  async set(col, id, data){
    const body = Object.assign({}, data); delete body.id;
    if(this.fs) return this.fs.collection(col).doc(id).set(body);
    (this.local[col] ||= {})[id] = body; this.saveLocal(); this.subs[col] && this.watch(col, this.subs[col]);
  },
  async update(col, id, patch){
    if(this.fs) return this.fs.collection(col).doc(id).set(patch, {merge:true});
    const cur = (this.local[col] ||= {})[id]; if(!cur) throw {code:"invalid_argument"};
    const merge = (x,y) => { for(const k in y){ if(y[k] && typeof y[k]==="object" && !Array.isArray(y[k]) && x[k] && typeof x[k]==="object") merge(x[k],y[k]); else x[k]=y[k]; } };
    merge(cur, patch); this.saveLocal(); this.subs[col] && this.watch(col, this.subs[col]);
  },
  async merge(col, id, data){
    const body = Object.assign({}, data); delete body.id;
    if(this.fs) return this.fs.collection(col).doc(id).set(body, {merge:true});
    return (this.local[col]||{})[id] ? this.update(col, id, body) : this.set(col, id, body);
  },
  async del(col, id){
    if(this.fs) return this.fs.collection(col).doc(id).delete();
    delete (this.local[col]||{})[id]; this.saveLocal(); this.subs[col] && this.watch(col, this.subs[col]);
  }
};

  const avulso = prev && prev.qtd>0 ? !!prev.avulso : (!c.planoId || statusCliente(c).k==="bad");
  const entry = Object.assign({qtd:Math.max(0,qtd), avulso, hora:new Date().toISOString()}, extra||{});
  const local = Object.assign({}, prev, entry);
  const existed = !!S.pedidos[d]; invalidar();
  S.pedidos[d] = Object.assign({data:d, enviado:false}, S.pedidos[d], {confirmados:Object.assign({}, pedido(d).confirmados, {[c.id]:local})});
  const novo = S.pedidos[d];
  return enqueue(() => existed ? Store.update("pedidos", d, {confirmados:{[c.id]:entry}}) : Store.merge("pedidos", d, novo));
}

const criando = new Set(), mudouModo = new Set();
function processarRespostas(){
  if(!window.__fs || !prontos("clientes","pedidos","respostas")) return;
  S.respostas.forEach(r => {
    if(!r.data) return;
    if(r.data < today()){ apagarResposta(r); return; }
    let c = idx().porTel.get(r.telefone);
    if(!c){
      if(S.config.autoCadastro===false || !(Number(r.qtd)>0) || criando.has(r.telefone)) return;
      criando.add(r.telefone);
      const e = splitEndereco(String(r.endereco||"").trim());
      const novo = {nome:String(r.nome||"").trim()||"Cliente", telefone:r.telefone, rua:e.rua||"", numero:e.numero||"", complemento:e.complemento||"", bairro:e.bairro||"", cidade:S.config.cidade||"", pagamento:"Pix", entregaModo:r.entrega||"", ativo:true, origem:"pedido pelo link", endLink:String(r.endereco||"").trim(), criadoEm:new Date().toISOString()};
      enqueue(() => Store.set("clientes", r.telefone, novo)).then(res => { if(res===FALHOU) criando.delete(r.telefone); else toast("Cliente novo cadastrado pelo link: "+novo.nome); });
      return; // entra na lista quando o cadastro chegar
    }
    const cur = (pedido(r.data).confirmados||{})[c.id];
    if(r.entrega && r.entrega!==c.entregaModo && !mudouModo.has(c.id)){ mudouModo.add(c.id); enqueue(() => Store.update("clientes", c.id, {entregaModo:r.entrega})); }
    if(cur && cur.respHora===r.hora){
      if(r.pago==="informado" && !cur.pixInformado) patchConf(r.data, {[c.id]:{pixInformado:true}});
      apagarResposta(r); return;
    }
    (() => { const end = String(r.endereco||"").trim(); if(end && !c.rua && !c.endereco){ const e = splitEndereco(end); const patch = {rua:e.rua||end, numero:e.numero||"", complemento:e.complemento||""}; if(e.bairro && !c.bairro) patch.bairro = e.bairro; enqueue(() => Store.update("clientes", c.id, patch)); } })(),
    setConf(r.data, c, Number(r.qtd)||0, {respHora:r.hora, origem:"link", endEntrega:(c.rua||c.endereco) && String(r.endereco||"").trim()!==(c.endLink||"") ? String(r.endereco||"").trim() : "", obsDia:String(r.obs||"").trim(), entrega:String(r.entrega||""), pixInformado:r.pago==="informado"}).then(res => { if(res!==FALHOU) apagarResposta(r); });
  });
}

const temEndereco = c => c.ativo!==false && c.telefone && (c.rua || c.endereco);
async function hashTel(t){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("marmitex:"+t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
let syncCon = false;
async function syncConhecidos(){
  if(syncCon || !window.__fs || !window.crypto || !crypto.subtle || !prontos("clientes")) return;
  syncCon = true;
  try{
    let feitos = {}; try{ feitos = JSON.parse(localStorage.getItem("marmitex-conh")||"{}"); }catch(e){}
    const quer = {}; for(const c of S.clientes) if(temEndereco(c)) quer[await hashTel(c.telefone)] = (c.planoId && statusCliente(c).k!=="bad") ? 2 : 1;
    const novos = Object.keys(quer).filter(h => feitos[h]!==quer[h]), velhos = Object.keys(feitos).filter(h => !quer[h]);
    const ops = [...novos.map(h => [h,quer[h]]), ...velhos.map(h => [h,0])];
    for(let i=0; i<ops.length; i+=400){
      const b = window.__fs.batch();
      ops.slice(i, i+400).forEach(([h,on]) => { const ref = window.__fs.collection("conhecidos").doc(h); on ? b.set(ref, on===2 ? {e:1, p:1} : {e:1}) : b.delete(ref); });
      await b.commit();
    }
    try{ localStorage.setItem("marmitex-conh", JSON.stringify(quer)); }catch(e){}
  }catch(e){ /* tenta de novo na próxima mudança */ }
  syncCon = false;
}

function filtrados(){
  const q = S.busca.trim().toLowerCase(), qd = q.replace(/\D/g,"");
  return S.clientes.filter(c => {
    if(S.filtro!=="todos"){ const s = statusCliente(c); if(S.filtro==="ativo" && s.k!=="ok") return false; if(S.filtro==="alerta" && !["warn","bad"].includes(s.k)) return false; if(S.filtro==="avulso" && s.t!=="Avulso") return false; if(S.filtro==="inativo" && s.t!=="Inativo") return false; }
    if(!q) return true;
    return (c.nome||"").toLowerCase().includes(q) || (qd && (c.telefone||"").includes(qd)) || (c.bairro||"").toLowerCase().includes(q) || (c.rua||"").toLowerCase().includes(q);
  }).sort((a,b) => (a.nome||"").localeCompare(b.nome||"","pt-BR"));
}

// ----- Importação WhatsApp -----
const ADDR_RE = /\b(rua|r\.|av\.?|avenida|travessa|tv\.|alameda|al\.|estrada|rodovia|rod\.|pra[çc]a|largo|quadra|qd\.?|condom[ií]nio|cond\.|vila|bloco|apto|apartamento)\b[^\n]{3,}/i;
const PAG_RE = /\b(pix|dinheiro|esp[eé]cie|cart[aã]o|cr[eé]dito|d[eé]bito|vale[- ]refei[çc][aã]o|\bvr\b|boleto)\b/i;
const PHONE_RE = /(?:\+?55\s?)?\(?\d{2}\)?\s?9?\s?\d{4}[-\s]?\d{4}/g;
function pagFrom(t){
  const m = t.match(PAG_RE); if(!m) return "";
  const w = m[1].toLowerCase();
  if(w==="pix") return "Pix"; if(/dinheiro|esp/.test(w)) return "Dinheiro"; if(/d[eé]bito/.test(w)) return "Cartão de débito"; if(/cr[eé]dito|cart/.test(w)) return "Cartão de crédito"; if(/vale|vr/.test(w)) return "Vale-refeição"; if(/boleto/.test(w)) return "Boleto"; return "";
}
const LINE_A = /^(\d{1,2}\/\d{1,2}\/\d{2,4}),?\s(\d{1,2}:\d{2})(?::\d{2})?\s?(?:[ap]\.?\s?m\.?)?\s?[-–]\s([^:]{1,60}?):\s([\s\S]*)$/i;
const LINE_B = /^\[(\d{1,2}\/\d{1,2}\/\d{2,4}),?\s(\d{1,2}:\d{2}(?::\d{2})?)(?:\s?[ap]\.?\s?m\.?)?\]\s([^:]{1,60}?):\s([\s\S]*)$/i;
const looksPhone = s => /^[+\d\s()\-‪‬]{8,}$/.test(s) && s.replace(/\D/g,"").length>=10;
function parseTxt(text, fileName, ignore){
  const msgs = []; let cur = null;
  text.replace(/\r/g,"").replace(/[‎‏‪‬]/g,"").split("\n").forEach(line => {
    const m = line.match(LINE_A) || line.match(LINE_B);
    if(m){ cur = {from:m[3].trim(), text:m[4]}; msgs.push(cur); }
    else if(cur) cur.text += "\n"+line;
  });
  const bySender = {};
  msgs.forEach(m => { if(ignore && m.from.toLowerCase()===ignore.toLowerCase()) return; (bySender[m.from] ||= []).push(m.text); });
  let chatName = (fileName||"").replace(/\.txt$/i,"").replace(/^(conversa do whatsapp com|whatsapp chat with|chat de whatsapp con)\s*/i,"").trim();
  const senders = Object.keys(bySender);
  const out = [];
  senders.forEach(s => {
    const texts = bySender[s]; const all = texts.join("\n");
    let nome = "", tel = "";
    if(looksPhone(s)) tel = normPhone(s); else nome = s;
    if(!nome && senders.length===1 && chatName && !looksPhone(chatName)) nome = chatName;
    if(!tel){ const ph = (all.match(PHONE_RE)||[]).map(normPhone).filter(x=>x.length>=12); if(ph.length) tel = ph[ph.length-1]; }
    if(!tel && senders.length===1 && looksPhone(chatName)) tel = normPhone(chatName);
    let end = ""; for(let i=texts.length-1;i>=0;i--){ const a = texts[i].match(ADDR_RE); if(a){ end = texts[i].trim().slice(0,200); break; } }
    let pag = ""; for(let i=texts.length-1;i>=0 && !pag;i--){ pag = pagFrom(texts[i]); }
    out.push({nome, telefone:tel, endereco:end, pagamento:pag, origem:fileName, msgs:texts.length});
  });
  return out;
}
function parseVcf(text, fileName){
  return text.replace(/\r/g,"").split(/BEGIN:VCARD/i).slice(1).map(card => {
    const get = re => { const m = card.match(re); return m ? m[1].trim() : ""; };
    const nome = get(/\nFN[^:]*:(.*)/i) || get(/\nN[^:]*:(.*)/i).split(";").filter(Boolean).reverse().join(" ");
    const tel = normPhone(get(/\nTEL[^:]*:(.*)/i));
    const adr = get(/\nADR[^:]*:(.*)/i).split(";").filter(Boolean).join(", ");
    return {nome, telefone:tel, endereco:adr, pagamento:"", origem:fileName, msgs:0};
  }).filter(c => c.nome || c.telefone);
}
function parseCsv(text, fileName){
  const lines = text.replace(/\r/g,"").split("\n").filter(l=>l.trim()); if(lines.length<2) return [];
  const sep = (lines[0].match(/;/g)||[]).length > (lines[0].match(/,/g)||[]).length ? ";" : ",";
  const split = l => { const r=[]; let cur="", q=false; for(const ch of l){ if(ch==='"') q=!q; else if(ch===sep && !q){ r.push(cur); cur=""; } else cur+=ch; } r.push(cur); return r.map(x=>x.trim()); };
  const h = split(lines[0]).map(x=>x.toLowerCase());
  const idx = re => h.findIndex(x=>re.test(x));
  const iN=idx(/nome|name/), iT=idx(/tel|fone|celular|whats|phone/), iE=idx(/ender|rua|address/), iP=idx(/pag/);
  return lines.slice(1).map(l => { const c = split(l); return {nome:iN>=0?c[iN]:"", telefone:iT>=0?normPhone(c[iT]):"", endereco:iE>=0?c[iE]:"", pagamento:iP>=0?pagFrom(c[iP])||c[iP]:"", origem:fileName, msgs:0}; }).filter(c=>c.nome||c.telefone);
}
function splitEndereco(e){
  if(!e) return {};
  const m = e.match(/^(.*?(?:rua|r\.|av\.?|avenida|travessa|tv\.|alameda|estrada|rodovia|pra[çc]a)[^,\d]*?)[, ]+(?:n[ºo°.]?\s*)?(\d+[a-z]?)\b([\s\S]*)$/i);
  const bm = e.match(/bairro[:\s]+([^\n,.]+)/i); const bairro = bm ? bm[1].trim() : "";
  const partes = e.split(",").map(x => x.trim());
  if(partes.length>=2 && partes[0] && /^(n[ºo°.]?\s*)?\d+[a-z]?$/i.test(partes[1])) return {bairro, rua:partes[0], numero:partes[1].replace(/^n[ºo°.]?\s*/i,""), complemento:partes.slice(2).join(", ").replace(/bairro[:\s]+[^\n,.]+/i,"").replace(/\s+/g," ").replace(/^[\s,\-–]+|[\s,\-–]+$/g,"").trim()};
  if(m) return {bairro, rua:m[1].replace(/^.*?(?=(rua|r\.|av|avenida|travessa|tv\.|alameda|estrada|rodovia|pra[çc]a))/i,"").trim(), numero:m[2], complemento:m[3].replace(/bairro[:\s]+[^\n,.]+/i,"").replace(/\s+/g," ").replace(/^[\s,\-–]+/,"").replace(/[\s,\-–]+$/,"").trim()};
  return {bairro, rua:e};
}
let IMP = [];
function importar(){
  openModal(`
    <h2>Importar clientes do WhatsApp</h2>
    <div class="muted" style="font-size:.92rem">
      <b>Como exportar no celular:</b> abra a conversa com o cliente, toque em ⋮ (ou no nome dele no iPhone), depois <b>Mais &gt; Exportar conversa &gt; Sem mídia</b> e salve o arquivo .txt. Repita para cada cliente ou exporte um grupo de clientes.
      Também aceito contatos em <b>.vcf</b> e planilhas em <b>.csv</b> (colunas nome, telefone, endereço, pagamento).
    </div>
    <div class="form">
      <label class="f c4">Arquivos (.txt, .vcf, .csv)<input type="file" id="files" multiple accept=".txt,.vcf,.csv,text/plain,text/vcard,text/csv"></label>
      <label class="f c2">Seu nome no WhatsApp (para ignorar)<input type="text" id="ign" value="${esc(S.config.meuNomeWhats)}" placeholder="Ex.: Marmitex da Ana"></label>
    </div>

    <div class="foot"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="doImp" disabled>Importar selecionados</button></div>`,
  () => {
    $("#files").onchange = async e => {
      const ign = $("#ign").value.trim(); if(ign !== S.config.meuNomeWhats) saveConfig({meuNomeWhats:ign});
      let all = [];
      for(const f of e.target.files){
        const text = await f.text(); const n = f.name.toLowerCase();
        if(n.endsWith(".vcf")) all = all.concat(parseVcf(text,f.name));
        else if(n.endsWith(".csv")) all = all.concat(parseCsv(text,f.name));
        else all = all.concat(parseTxt(text,f.name,ign));
      }
      const map = new Map();
      all.forEach(c => {
        const k = c.telefone || ("nome:"+(c.nome||"").toLowerCase()); if(k==="nome:") return;
        const p = map.get(k); if(!p) map.set(k, c); else { ["nome","telefone","endereco","pagamento"].forEach(f => { if(!p[f] && c[f]) p[f]=c[f]; }); p.msgs += c.msgs; }
      });
      IMP = [...map.values()].map(c => { const ex = S.clientes.find(x => (c.telefone && x.telefone===c.telefone) || (!c.telefone && c.nome && (x.nome||"").toLowerCase()===c.nome.toLowerCase())); return Object.assign(c,{existe:!!ex, sel:true}); });
      const sem = IMP.filter(c=>!c.telefone).length;
      $("#prev").innerHTML = IMP.length ? `
        <p><b>${IMP.length}</b> contatos encontrados. ${IMP.filter(c=>c.existe).length} já cadastrados (só completo os campos vazios). ${sem?`<span class="pill warn">${sem} sem telefone</span>`:""}</p>
        <div class="tablebox" style="max-height:340px;overflow:auto"><table><thead><tr><th><input type="checkbox" id="selAll" checked aria-label="Selecionar todos"></th><th>Nome</th><th>Telefone</th><th>Endereço encontrado</th><th>Pagamento</th></tr></thead><tbody>
        ${IMP.map((c,i)=>`<tr><td><input type="checkbox" data-i="${i}" checked aria-label="Selecionar"></td><td>${esc(c.nome||"(sem nome)")} ${c.existe?'<span class="pill">já existe</span>':""}</td><td class="num">${fmtPhone(c.telefone)}</td><td>${esc(c.endereco||"—")}</td><td>${esc(c.pagamento||"—")}</td></tr>`).join("")}
        </tbody></table></div>` : `<p class="banner">Não encontrei contatos nesses arquivos. Confira se é a conversa exportada em .txt, sem mídia.</p>`;
      $("#doImp").disabled = !IMP.length;
      const sa = $("#selAll"); if(sa) sa.onchange = () => document.querySelectorAll("#prev [data-i]").forEach(cb => { cb.checked = sa.checked; IMP[cb.dataset.i].sel = sa.checked; });
      document.querySelectorAll("#prev [data-i]").forEach(cb => cb.onchange = () => IMP[cb.dataset.i].sel = cb.checked);
    };
    $("#doImp").onclick = async () => {
      const sel = IMP.filter(c=>c.sel); const btn = $("#doImp"); btn.disabled = true; let ok = 0;
      for(const c of sel){
        btn.textContent = "Importando "+(ok+1)+" de "+sel.length+"...";
        const ex = S.clientes.find(x => (c.telefone && x.telefone===c.telefone) || (!c.telefone && c.nome && (x.nome||"").toLowerCase()===c.nome.toLowerCase()));
        const end = splitEndereco(c.endereco);
        const novo = {nome:c.nome||fmtPhone(c.telefone), telefone:c.telefone, rua:end.rua||"", numero:end.numero||"", complemento:end.complemento||"", bairro:end.bairro||"", pagamento:c.pagamento||"", ativo:true, origem:"WhatsApp", atualizado:new Date().toISOString()};
        let data = novo, id = c.telefone || uid();
        if(ex){ id = ex.id; data = Object.assign({}, ex); Object.keys(novo).forEach(k => { if(!data[k] && novo[k]) data[k] = novo[k]; }); }
        try{ await Store.set("clientes", id, data); ok++; }catch(e){ toast(erroMsg(e)); break; }
      }
      closeModal(); toast(ok+" clientes importados.");
    };
  });
}

function ultimoPreco(){ const pp = precoPadrao(); if(pp) return pp; const k = Object.keys(S.cardapios).filter(k => S.cardapios[k].preco).sort().pop(); return k ? S.cardapios[k].preco : ""; }
function loadDraft(){ const c = S.cardapios[S.cardData]; draft = c ? structuredClone(c) : {itens:[{nome:"",cat:"Prato principal"},{nome:"",cat:"Carboidrato"},{nome:"",cat:"Legumes"},{nome:"",cat:"Salada"}], preco:ultimoPreco(), obs:""}; draft.itens = draft.itens||[]; }
// Pratos sugeridos por categoria: os da biblioteca + os que você já usou
function pratosCat(cat){
  const set = new Set(PRATOS_FIT[cat]||[]);
  Object.values(S.cardapios).forEach(c => (c.itens||[]).forEach(i => { if(i.cat===cat && i.nome) set.add(i.nome); }));
  return [...set].sort((a,b) => a.localeCompare(b,"pt-BR"));
}
// Pratos principais usados perto da data (para não repetir)
function usadosPerto(d, dias, extra){
  const u = new Set(extra||[]);
  for(let i=-dias; i<=dias; i++){ if(!i) continue; const c = S.cardapios[addDays(d,i)]; if(c) (c.itens||[]).forEach(x => { if(x.cat==="Prato principal") u.add(x.nome); }); }
  return u;
}
const sortear = l => l[Math.floor(Math.random()*l.length)];
function sugerirCardapio(d, evitar){
  const u = usadosPerto(d, 6, evitar);
  const prontos = CARDAPIOS_FIT.filter(m => !m.itens.some(i => i.cat==="Prato principal" && u.has(i.nome)));
  const m = sortear(prontos.length ? prontos : CARDAPIOS_FIT);
  return {nome:m.nome, itens:m.itens.map(i => Object.assign({}, i))};
}

const corMarca = () => /^#[0-9a-f]{6}$/i.test(S.config.corMarca||"") ? S.config.corMarca : "#1f5c3d";
function aplicarMarca(){

function lerLogo(file){
  return new Promise((ok, erro) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const N = 320, c = document.createElement("canvas"); c.width = c.height = N; const x = c.getContext("2d");
      const k = Math.min(N/img.width, N/img.height); const w = img.width*k, h = img.height*k;
      x.drawImage(img, (N-w)/2, (N-h)/2, w, h); URL.revokeObjectURL(url);
      let d = c.toDataURL("image/png");
      if(d.length > 180000){ const c2 = document.createElement("canvas"); c2.width = c2.height = N; const y = c2.getContext("2d"); y.fillStyle = "#fff"; y.fillRect(0,0,N,N); y.drawImage(c,0,0); d = c2.toDataURL("image/jpeg", .85); }
      ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); erro(new Error("imagem")); };
    img.src = url;
  });
}

// Imagem do cardápio (1080 x 1350) para status, transmissão e Instagram
async function imagemCardapio(d, cx){
  const c = cx || S.cardapios[d] || {itens:[]}, W = 1080, H = 1350, cor = corMarca();
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const x = cv.getContext("2d");
  try{ await document.fonts.ready; }catch(e){}
  const F = (w, px) => w+" "+px+"px 'Familjen Grotesk','Atkinson Hyperlegible','Segoe UI',Arial,sans-serif";
  const quebra = (txt, max, font) => { x.font = font; const out = []; let l = ""; String(txt).split(" ").forEach(w => { const t = l ? l+" "+w : w; if(x.measureText(t).width > max && l){ out.push(l); l = w; } else l = t; }); if(l) out.push(l); return out; };
  // conteúdo
  const blocos = [];
  CATEGORIAS.forEach(cat => { const its = (c.itens||[]).filter(i => i.cat===cat && i.nome); if(its.length) blocos.push({t:cat, l:its.map(i => i.nome)}); });
  const precos = modOn("precos") ? S.precos.filter(p => p.ativo!==false && p.cat==="Marmita").sort((a,b)=>(a.preco||0)-(b.preco||0)) : [];
  const promos = modOn("precos") ? promosDia(d) : [];
  // fundo
  x.fillStyle = "#ffffff"; x.fillRect(0,0,W,H);
  x.fillStyle = cor; x.fillRect(0,0,W,250);
  let tx = 64;
  if(logoOk()){ const img = new Image(); img.src = S.config.logo; await new Promise(r => { img.onload = r; img.onerror = r; });
    x.save(); x.beginPath(); x.arc(64+85, 125, 85, 0, Math.PI*2); x.fillStyle = "#fff"; x.fill(); x.clip(); x.drawImage(img, 64+10, 50, 150, 150); x.restore(); tx = 64+170+36; }
  const dt = parseIso(d);
  x.fillStyle = "#fff"; x.font = F(700, 60); x.fillText(quebra(S.config.restaurante||"Cardápio do dia", W-tx-60, F(700,60))[0], tx, 118);
  x.font = F(400, 38); x.globalAlpha = .92; x.fillText("Cardápio de "+DOW_LONG[dt.getDay()]+", "+pad(dt.getDate())+"/"+pad(dt.getMonth()+1), tx, 178); x.globalAlpha = 1;
  // corpo com ajuste automático de tamanho
  const topo = 300, fim = H-140, larg = W-128;
  const medir = k => { let h = 0; blocos.forEach(b => { h += 48*k + b.l.reduce((s,i)=>s+quebra("• "+i, larg, F(400, Math.round(36*k))).length*46*k, 0) + 18*k; }); if(precos.length) h += 48*k + precos.length*46*k + 18*k; if(promos.length) h += 30*k + promos.reduce((s,p)=>s+quebra(textoPromo(p), larg-40, F(700, Math.round(32*k))).length*42*k,0) + 30*k; return h; };
  let k = 1; while(k > .55 && medir(k) > fim-topo) k -= .05;
  let y = topo;
  blocos.forEach(b => {
    x.fillStyle = cor; x.font = F(700, Math.round(30*k)); x.fillText(b.t.toUpperCase(), 64, y+30*k); y += 48*k;
    x.fillStyle = "#1b241d"; b.l.forEach(i => quebra("• "+i, larg, F(400, Math.round(36*k))).forEach(l => { x.font = F(400, Math.round(36*k)); x.fillText(l, 64, y+34*k); y += 46*k; })); y += 18*k;
  });
  if(precos.length){
    x.fillStyle = cor; x.font = F(700, Math.round(30*k)); x.fillText("PREÇOS", 64, y+30*k); y += 48*k;
    precos.forEach(p => { const h = precoNoDia(p, d), cheio = Number(p.preco)||0; x.fillStyle = "#1b241d"; x.font = F(400, Math.round(36*k)); x.fillText(p.nome+(p.descricao?" ("+p.descricao+")":""), 64, y+34*k);
      x.font = F(700, Math.round(36*k)); const v = brl(h), vw = x.measureText(v).width; x.fillText(v, W-64-vw, y+34*k);
      if(h < cheio){ x.font = F(400, Math.round(28*k)); x.fillStyle = "#8a948c"; const o = brl(cheio), ow = x.measureText(o).width, vx = W-64-vw-18-ow; x.fillText(o, vx, y+32*k); x.fillRect(vx, y+22*k, ow, 2); }
      y += 46*k; }); y += 18*k;
  }
  if(promos.length){
    const linhas = promos.map(p => quebra(textoPromo(p), larg-40, F(700, Math.round(32*k))));
    const hb = 30*k + linhas.reduce((s,l)=>s+l.length*42*k,0) + 10*k;
    x.fillStyle = "#fbecc9"; x.beginPath(); x.roundRect ? x.roundRect(48, y, W-96, hb, 18) : x.rect(48, y, W-96, hb); x.fill();
    x.fillStyle = "#7a4d00"; let yy = y+18*k; linhas.forEach(ls => ls.forEach((l,j) => { x.font = F(700, Math.round(32*k)); x.fillText((j?"   ":"🔥 ")+l, 70, yy+30*k); yy += 42*k; }));
  }
  // rodapé
  x.fillStyle = cor; x.fillRect(0, H-110, W, 110); x.fillStyle = "#fff"; x.font = F(700, 36);
  const rod = "Peça até "+(S.config.horarioLimite||"10:30")+" pelo link"+(S.config.telefoneRestaurante?" ou WhatsApp "+fmtPhone(normPhone(S.config.telefoneRestaurante)):"");
  const rl = quebra(rod, W-128, F(700,32)).slice(0,2); x.font = F(700,32); rl.forEach((l,i) => x.fillText(l, 64, rl.length>1 ? H-66+i*42 : H-43));
  return new Promise(ok => cv.toBlob(ok, "image/png"));
}

const CAT_PRECO = ["Marmita","Congelada","Adicional","Bebida","Sobremesa","Taxa de entrega","Outro"];

const precoItem = id => S.precos.find(p => p.id===id);

function alvoPromo(p){ if(!p.alvo) return "Tudo"; if(p.alvo.startsWith("cat:")) return "Toda a categoria "+p.alvo.slice(4); const i = precoItem(p.alvo); return i ? i.nome : "(item apagado)"; }
function valePara(p, it){ return !p.alvo || p.alvo===it.id || p.alvo==="cat:"+it.cat; }
function precoNoDia(it, d){
  let v = Number(it.preco)||0, best = v;
  promosDia(d).filter(p => valePara(p, it) && p.tipo!=="texto").forEach(p => { const n = p.tipo==="preco" ? Number(p.valor)||v : v*(1-(Number(p.valor)||0)/100); if(n < best) best = n; });
  return Math.round(best*100)/100;
}
function precoPadrao(){ const l = S.precos.filter(p => p.ativo!==false && p.cat==="Marmita"); const it = l.find(p => p.padrao) || l[0]; return it ? precoNoDia(it, S.cardData||today()) : 0; }
function linhasPrecos(d, cats){
  return S.precos.filter(p => p.ativo!==false && (!cats || cats.includes(p.cat))).sort((a,b) => CAT_PRECO.indexOf(a.cat)-CAT_PRECO.indexOf(b.cat) || (a.preco||0)-(b.preco||0))
    .map(p => { const h = precoNoDia(p, d), cheio = Number(p.preco)||0; return "• "+p.nome+(p.descricao?" ("+p.descricao+")":"")+": "+(h<cheio ? "~"+brl(cheio)+"~ *"+brl(h)+"*" : (cheio ? brl(cheio) : "grátis")); }).join("\n");
}
function textoPromo(p){
  const desc = p.tipo==="pct" ? (Number(p.valor)||0)+"% de desconto" : p.tipo==="preco" ? "por "+brl(p.valor) : "";
  const dias = (p.dias||[]).length && p.dias.length<7 ? " (só "+p.dias.map(i=>DOW[i]).join(", ")+")" : "";
  return p.nome+(desc?": "+desc+(p.alvo?" em "+alvoPromo(p).replace("Toda a categoria ",""):""):"")+(p.descricao?". "+p.descricao:"")+dias+(p.fim?" · até "+fmtDate(p.fim).slice(0,5):"");
}
function statusPromo(p){ const t = today(); if(p.ativo===false) return ["pausada",""]; if(p.fim && p.fim<t) return ["encerrada",""]; if(p.inicio && p.inicio>t) return ["começa "+fmtDate(p.inicio).slice(0,5),"warn"]; return promoAtiva(p,t) ? ["valendo hoje","ok"] : ["fora do dia","warn"]; }
function textoTabela(){
  const d = today(); let t = "💰 *Tabela de preços"+(S.config.restaurante?" · "+S.config.restaurante:"")+"*\n";
  CAT_PRECO.forEach(c => { const l = linhasPrecos(d, [c]); if(l) t += "\n*"+c+"*\n"+l+"\n"; });
  const pl = S.planos.filter(p => p.tipo!=="personalizado" && p.preco);
  if(pl.length) t += "\n*Planos*\n"+pl.map(p => "• "+p.nome+" ("+(p.marmitas||0)+" marmitas): "+brl(p.preco)+(p.marmitas?" · "+brl(p.preco/p.marmitas)+" cada":"")).join("\n")+"\n";
  if(modOn("congeladas") && S.pacotes.some(p=>p.ativo!==false)) t += "\n*Pacotes de congeladas*\n"+listaPacotes()+"\n";
  const pr = promosDia(d); if(pr.length) t += "\n🔥 *Promoções*\n"+pr.map(p => "• "+textoPromo(p)).join("\n")+"\n";
  return t+"\n🛵 Entregamos na sua casa ou no trabalho.";
}

  const lista = S.precos.slice().sort((a,b) => CAT_PRECO.indexOf(a.cat)-CAT_PRECO.indexOf(b.cat) || (a.preco||0)-(b.preco||0));

    ${lista.length ? `<div class="tablebox"><table style="min-width:0"><thead><tr><th>Item</th><th>Tipo</th><th>Preço</th><th>Hoje com promoção</th></tr></thead><tbody>${lista.map(linha).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">Cadastre os tamanhos de marmita, adicionais, bebidas e a taxa de entrega. Ou carregue a tabela de exemplo e ajuste os valores.</p>`}
    <p class="muted" style="margin:0;font-size:.85rem">A marmita marcada como <b>padrão</b> vira o preço avulso do cardápio. Planos e pacotes de congeladas têm os preços nas abas deles e também entram na tabela copiada.</p>
  </section>
  <section class="panel" style="display:flex;flex-direction:column;gap:10px">
    <div class="row" style="justify-content:space-between"><h2>Promoções</h2><button class="btn small primary" id="pmNovo">+ Promoção</button></div>
    ${promos.length ? `<div class="tablebox"><table style="min-width:0"><thead><tr><th>Promoção</th><th>Vale para</th><th>Período</th><th>Situação</th></tr></thead><tbody>${promos.map(lp).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">Ex.: "Terça fit: marmita M por R$ 19,90" só às terças, ou "10% em todas as marmitas" de 01 a 15/11.</p>`}
  </section>

  });
}

// ----- Congeladas -----
const pacote = id => S.pacotes.find(p => p.id===id);
const congDia = d => S.encomendas.filter(e => e.data===d);
const unidadesEnc = e => (Number(e.unidades)||0)*(Number(e.qtd)||1);
const descEnc = e => { const q = Number(e.qtd)||1; return q+"× "+(e.pacoteNome||"pacote")+(e.unidades?" ("+unidadesEnc(e)+" un.)":""); };
function listaPacotes(){ const l = S.pacotes.filter(p => p.ativo!==false); return l.length ? l.map(p => "• "+p.nome+(p.unidades?" ("+p.unidades+" refeições)":"")+": "+brl(p.preco)+(p.descricao?"\n   "+p.descricao:"")).join("\n") : "• (cadastre os pacotes na aba Congeladas)"; }
function proximoAberto(){ for(let i=0;i<21;i++){ const d = addDays(today(),i); if(isOpen(d)) return d; } return today(); }
function moverEstoque(n, obs){
  if(!n) return;
  const mov = [{d:new Date().toISOString(), n, obs:obs||""}, ...(S.config.movCong||[])].slice(0,20);
  return saveConfig({estoqueCong:(Number(S.config.estoqueCong)||0)+n, movCong:mov});
}
function marcarPagoCong(e, v){
  e.pago = v; enqueue(() => Store.update("encomendas", e.id, {pago:v}));
  const c = idx().porId.get(e.clienteId)||{};
  if(v) addLanc(today(), "cg-"+e.id, {tipo:"receita", cat:"Congeladas", valor:Number(e.valor)||0, desc:(c.nome||"")+" · "+descEnc(e), pag:c.pagamento||"", clienteId:e.clienteId||"", apagado:false});
  else { const l = lancId("cg-"+e.id); if(l) apagarLanc(l.data, l.id); }
}
function marcarEntregueCong(e, v){
  if(!!e.entregue===v) return;
  e.entregue = v; enqueue(() => Store.update("encomendas", e.id, {entregue:v}));
  moverEstoque(v ? -unidadesEnc(e) : unidadesEnc(e), (v?"Entregue: ":"Desfeito: ")+((idx().porId.get(e.clienteId)||{}).nome||""));
}

  </section>
  <textarea id="msgCopy" aria-hidden="true" tabindex="-1" style="position:absolute;left:-9999px;width:1px;height:1px"></textarea>`;

// ----- Relatórios -----
function periodo(){
  const t = today();
  if(S.relPeriodo==="hoje") return [t,t];
  if(S.relPeriodo==="7") return [addDays(t,-6),t];
  if(S.relPeriodo==="30") return [addDays(t,-29),t];
  if(S.relPeriodo==="mes") return [t.slice(0,8)+"01",t];
  const d = parseIso(t.slice(0,8)+"01"); d.setDate(0); const fim = iso(d); return [fim.slice(0,8)+"01",fim];
}
function dadosRel(){
  const [ini,fim] = periodo();
  const dias = Object.keys(S.pedidos).filter(d => d>=ini && d<=fim).sort();
  const porDia = dias.map(d => { const c = confirmadosDia(d); const pl = c.filter(x=>!x.avulso).reduce((s,x)=>s+x.qtd,0), av = c.filter(x=>x.avulso).reduce((s,x)=>s+x.qtd,0); return {d, cli:c.length, pl, av, rec:av*(Number(S.cardapios[d] && S.cardapios[d].preco)||0)}; }).filter(x => x.pl+x.av>0);
  const porCli = {};
  S.clientes.filter(c => c.ativo!==false && c.planoId).forEach(c => porCli[c.id] = {c, pl:0, av:0, dias:0});
  dias.forEach(d => confirmadosDia(d).forEach(x => { const o = porCli[x.id] ||= {c:x.cliente, pl:0, av:0, dias:0}; o.dias++; if(x.avulso) o.av += x.qtd; else o.pl += x.qtd; }));
  let cli = Object.values(porCli);
  if(S.relTipo==="plano") cli = cli.filter(o => o.c.planoId);
  if(S.relTipo==="avulso") cli = cli.filter(o => !o.c.planoId || o.av>0);
  cli.sort((a,b) => (b.pl+b.av)-(a.pl+a.av) || (a.c.nome||"").localeCompare(b.c.nome||"","pt-BR"));
  return {ini, fim, porDia, cli};
}

// ----- Confirmação em lote pelas respostas do WhatsApp -----
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
function acharCliente(s){
  const dg = String(s||"").replace(/\D/g,"");
  if(dg.length>=8){ const fim = dg.slice(-8); const c = S.clientes.find(c => (c.telefone||"").endsWith(fim)); if(c) return c; }
  const n = norm(s); if(n.length<3) return null;
  let best = null;
  S.clientes.forEach(c => { const cn = norm(c.nome); if(cn.length>=3 && (n===cn || n.includes(cn) || (n.length>=5 && cn.startsWith(n)))){ if(!best || cn.length>norm(best.nome).length) best = c; } });
  return best;
}
function parseRespostas(txt){
  const res = new Map(), semCliente = [];
  txt.replace(/\r/g,"").replace(/[‎‏‪‬]/g,"").split("\n").forEach(raw => {
    const line = raw.trim(); if(!line) return;
    const m = line.match(/^\[[^\]]{4,30}\]\s*([^:]{1,60}):\s*(.*)$/) || line.match(/^\d{1,2}\/\d{1,2}\/\d{2,4},?\s\d{1,2}:\d{2}\s?[-–]\s([^:]{1,60}):\s*(.*)$/);
    const who = m ? m[1].trim() : line, msg = m ? m[2] : line;
    if(m && S.config.meuNomeWhats && norm(who)===norm(S.config.meuNomeWhats)) return;
    const tel = !m && (line.match(PHONE_RE)||[])[0];
    const c = (tel && acharCliente(tel)) || acharCliente(m ? who : line.replace(/\bx\s*\d{1,2}\b|\d{1,2}\s*(marm\w*|x\b|unid\w*)/gi,"")) || (m ? acharCliente(msg) : null);
    if(!c){ semCliente.push(line); return; }
    const neg = /\b(n[aã]o|cancel\w*|hoje n)/i.test(msg) && !/\bn[aã]o tem\b/i.test(msg);
    let qm = msg.match(/(\d{1,2})\s*(?:marm|x\b|unid|quent)/i) || msg.match(/\bx\s*(\d{1,2})\b/i) || (m ? msg.match(/^\s*(\d{1,2})\s*$/) || msg.match(/\b(?:quero|manda|mande|confirmo|sim)\D{0,6}(\d{1,2})\b/i) : null);
    const padrao = plano(c.planoId)?.porDia || 1;
    const prev = res.get(c.id);
    res.set(c.id, {c, qtd: qm ? Number(qm[1]) : (prev ? prev.qtd : padrao), neg: prev ? (prev.neg && neg) || (!prev.neg && neg && !!m) : neg, linha: line});
  });
  return {lista:[...res.values()], semCliente};
}
function colarRespostas(){
  let R = {lista:[], semCliente:[]};
  openModal(`

const entregador = id => S.entregadores.find(e => e.id===id);
const enderecoMapa = c => [[c.rua, c.numero].filter(Boolean).join(", "), c.bairro, c.cidade || S.config.cidade].filter(Boolean).join(", ");
function patchConf(d, patch){
  for(const id in patch) if(id.startsWith("cg:")){ const eid = id.slice(3), v = patch[id]; delete patch[id]; const e = S.encomendas.find(x => x.id===eid); if(e) Object.assign(e, v); enqueue(() => Store.update("encomendas", eid, v)); }
  if(!Object.keys(patch).length) return;
  const p = S.pedidos[d]; if(!p) return;
  const c = Object.assign({}, p.confirmados); for(const id in patch) c[id] = Object.assign({}, c[id], patch[id]);
  S.pedidos[d] = Object.assign({}, p, {confirmados:c});
  return enqueue(() => Store.update("pedidos", d, {confirmados:patch}));
}
// Paradas do dia: marmitas confirmadas + congeladas a entregar (juntas quando é o mesmo cliente)
function paradasDia(d){
  const out = confirmadosDia(d).map(x => Object.assign(x, {cong:[]}));
  if(!modOn("congeladas")) return out;
  const by = new Map(out.map(x => [x.id, x]));
  congDia(d).filter(e => !e.entregue).forEach(e => { const c = idx().porId.get(e.clienteId); if(!c) return; const x = by.get(c.id); if(x) x.cong.push(e); else { const n = {id:"cg:"+e.id, qtd:0, avulso:false, origem:"cong", cliente:c, cong:[e], enc:e}; by.set(c.id, n); out.push(n); } });
  return out;
}
const metaParada = (pc, x) => x.enc ? {entregador:x.enc.entregador, ordem:x.enc.ordem} : (pc[x.id]||{});
function descParada(x){ const p = []; if(x.qtd) p.push(x.qtd+(x.qtd>1?" marmitas":" marmita")); (x.cong||[]).forEach(e => p.push("🧊 "+descEnc(e))); return p.join(" + "); }
const cobrarCong = x => (x.cong||[]).filter(e => !e.pago).reduce((s,e) => s+(Number(e.valor)||0), 0);
function rotasDia(d){
  const pc = pedido(d).confirmados||{};
  const by = {}; S.entregadores.forEach(e => by[e.id] = []); by[""] = [];
  paradasDia(d).forEach(x => { const e = metaParada(pc,x).entregador; x.ordem = metaParada(pc,x).ordem ?? 9999; (by[entregador(e) ? e : ""]).push(x); });
  const cmp = (a,b) => a.ordem-b.ordem || norm(a.cliente.bairro).localeCompare(norm(b.cliente.bairro)) || norm(a.cliente.rua).localeCompare(norm(b.cliente.rua)) || (parseInt(a.cliente.numero)||0)-(parseInt(b.cliente.numero)||0);
  Object.values(by).forEach(l => l.sort(cmp));
  return by;
}
function distribuir(d, refazer){
  const ents = S.entregadores.filter(e => e.ativo!==false);
  if(!ents.length){ toast("Cadastre pelo menos um entregador."); return; }
  const pc = pedido(d).confirmados||{}, conf = paradasDia(d), carga = {};
  ents.forEach(e => carga[e.id] = 0);
  if(!refazer) conf.forEach(x => { const e = metaParada(pc,x).entregador; if(e in carga) carga[e] += x.qtd||1; });
  const pend = conf.filter(x => refazer || !(metaParada(pc,x).entregador in carga));
  if(!pend.length && !refazer){ toast("Todas as entregas já têm entregador."); return; }
  const grupos = {}; pend.forEach(x => (grupos[norm(x.cliente.bairro)] ||= []).push(x));
  const dono = {};
  Object.entries(grupos).sort((a,b) => b[1].length-a[1].length).forEach(([b,l]) => {
    let e = b && ents.find(e => String(e.bairros||"").split(",").map(norm).filter(Boolean).includes(b));
    if(!e) e = ents.slice().sort((a,c) => carga[a.id]-carga[c.id])[0];
    carga[e.id] += l.reduce((s,x)=>s+(x.qtd||1),0); l.forEach(x => dono[x.id] = e.id);
  });
  const patch = {}, final = {};
  conf.forEach(x => { const e = dono[x.id] || metaParada(pc,x).entregador; (final[e] ||= []).push(x); });
  Object.values(final).forEach(l => {
    l.sort((a,b) => norm(a.cliente.bairro).localeCompare(norm(b.cliente.bairro)) || norm(a.cliente.rua).localeCompare(norm(b.cliente.rua)) || (parseInt(a.cliente.numero)||0)-(parseInt(b.cliente.numero)||0));
    l.forEach((x,i) => patch[x.id] = {entregador: dono[x.id] || metaParada(pc,x).entregador || "", ordem:i});
  });
  patchConf(d, patch); render(); toast("Entregas distribuídas.");
}
function moverParada(d, eid, id, dir){
  const l = rotasDia(d)[eid] || []; const i = l.findIndex(x => x.id===id), j = i+dir;
  if(i<0 || j<0 || j>=l.length) return;
  [l[i], l[j]] = [l[j], l[i]];
  const patch = {}; l.forEach((x,k) => patch[x.id] = {ordem:k});
  patchConf(d, patch); render();
}
function mapsLinks(lista){
  const pts = lista.map(x => enderecoMapa(x.cliente)).filter(Boolean), links = [];
  let origem = S.config.enderecoRestaurante || "";

    const ch = pts.slice(i,i+10); let o = origem, rest = ch;
    if(!o){ o = ch[0]; rest = ch.length>1 ? ch.slice(1) : ch; }
    const dest = rest[rest.length-1], wp = rest.slice(0,-1);
    links.push("https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(o)+"&destination="+encodeURIComponent(dest)+(wp.length?"&waypoints="+encodeURIComponent(wp.join("|")):"")+"&travelmode=driving");
    origem = ch[ch.length-1];
  }
  return links;
}

function textoProducao(d){
  const conf = confirmadosDia(d), tot = conf.reduce((s,x)=>s+x.qtd,0), av = conf.filter(x=>x.avulso).reduce((s,x)=>s+x.qtd,0);

function addLanc(d, id, item){

  S.fin[d] = Object.assign({data:d, itens:{}}, S.fin[d]); S.fin[d] = Object.assign({}, S.fin[d], {itens:Object.assign({}, S.fin[d].itens, {[id]:item})});

function marmitasEntre(ini, fim){ let n = 0, av = 0; for(const d in S.pedidos){ if(d<ini||d>fim) continue; confirmadosDia(d).forEach(x => { n += x.qtd; if(x.avulso) av += x.qtd; }); } return {n, av}; }
function custos(){
  const t = today(), ini = addDays(t,-29), l = lancamentos(ini,t).filter(x=>x.tipo==="despesa");
  const variavel = l.filter(x=>CAT_VAR.includes(x.cat)).reduce((s,x)=>s+x.valor,0), fixo = l.filter(x=>!CAT_VAR.includes(x.cat)).reduce((s,x)=>s+x.valor,0);
  const m = marmitasEntre(ini,t).n;
  const calc = m>=20 && variavel>0 ? variavel/m : 0;
  return {
    porMarmita: calc || Number(S.config.custoMarmita)||0, porMarmitaCalc: calc,
    fixoMes: Number(S.config.custoFixoMensal)||fixo, fixoCalc: fixo, marmitas30: m
  };
}
function previsao(){
  const t = today(), c = custos();
  const dias = []; for(let i=1;i<=30;i++){ const d = addDays(t,i); if(isOpen(d)) dias.push(d); }
  const diasAbertos = dias.length || 22;
  const hist = Object.keys(S.pedidos).filter(d => d<=t && d>=addDays(t,-28)).map(d => marmitasEntre(d,d)).filter(x=>x.n>0);
  const mediaDia = hist.length ? hist.reduce((s,x)=>s+x.n,0)/hist.length : 0;
  const mediaAv = hist.length ? hist.reduce((s,x)=>s+x.av,0)/hist.length : 0;
  const precos = Object.values(S.cardapios).filter(x=>x.preco).sort((a,b)=>String(b.data).localeCompare(String(a.data))).slice(0,10).map(x=>Number(x.preco));
  const precoAv = precos.length ? precos.reduce((s,x)=>s+x,0)/precos.length : 0;
  const ativosPlano = S.clientes.filter(x => x.ativo!==false && x.planoId && statusCliente(x).k!=="bad");
  const renov = S.clientes.filter(x => x.ativo!==false && x.planoId && x.fim && x.fim>=t && x.fim<=addDays(t,30)).reduce((s,x)=>s+(Number(plano(x.planoId)?.preco)||0),0);
  const saldoTotal = ativosPlano.reduce((s,x)=>s+Math.max(0, x.marmitasContratadas?saldo(x):0),0);
  const marmitasPrev = Math.round(mediaDia*diasAbertos);
  const recAv = mediaAv*diasAbertos*precoAv;
  const receita = renov + recAv, despesa = marmitasPrev*c.porMarmita + c.fixoMes;
  const valores = ativosPlano.map(x => { const p = plano(x.planoId); return p && p.marmitas ? p.preco/p.marmitas : 0; }).filter(Boolean);
  const precoMedio = valores.length ? valores.reduce((s,x)=>s+x,0)/valores.length : precoAv;
  const margemUn = precoMedio - c.porMarmita;
  return {c, diasAbertos, diasDoCalendario:dias.length>0, mediaDia, mediaAv, precoAv, renov, recAv, receita, despesa, lucro:receita-despesa, marmitasPrev, saldoTotal, custoPlanos:saldoTotal*c.porMarmita, precoMedio, margemUn, equilibrio: margemUn>0 ? Math.ceil(c.fixoMes/margemUn) : null};
}
function aReceber(){
  const d = S.diaData, preco = Number(S.cardapios[d] && S.cardapios[d].preco)||0;
  const av = confirmadosDia(d).filter(x=>x.avulso).map(x => ({tipo:"av", id:"av-"+d+"-"+x.id, c:x.cliente, valor:x.qtd*preco, desc:x.qtd+" avulsa(s) em "+fmtDate(d), d}));
  const pl = S.clientes.filter(c => c.ativo!==false && c.planoId && c.inicio && c.inicio>=addDays(today(),-45)).map(c => ({tipo:"pl", id:"pl-"+c.id+"-"+c.inicio, c, valor:Number(plano(c.planoId)?.preco)||0, desc:"Plano "+(plano(c.planoId)?.nome||"")+" desde "+fmtDate(c.inicio)}));
  const cg = modOn("congeladas") ? S.encomendas.filter(e => !e.pago && e.data<=addDays(today(),7)).map(e => ({tipo:"cg", id:"cg-"+e.id, enc:e, c:idx().porId.get(e.clienteId)||{nome:"(cliente apagado)"}, valor:Number(e.valor)||0, desc:"Congeladas: "+descEnc(e)+" · entrega "+fmtDate(e.data)})) : [];
  const pagos = new Set(todosLanc().map(l=>l.id));
  return [...av, ...pl, ...cg].filter(x => !pagos.has(x.id));
}

const COLS_BACKUP = ["clientes","planos","pacotes","encomendas","precos","promocoes","cardapios","pedidos","financeiro","entregadores","config","acesso","publico","respostas"];
const diasDesdeBackup = () => S.config.ultimoBackup ? Math.floor((parseIso(today()) - parseIso(S.config.ultimoBackup.slice(0,10)))/86400000) : null;
function viewBackup(){
  const dd = diasDesdeBackup();
  return `<section class="panel" style="display:flex;flex-direction:column;gap:12px"><h2>Backup</h2>
    <p class="muted" style="margin:0">Baixe uma cópia de tudo (clientes, planos, pedidos, financeiro...) num arquivo e guarde no computador ou no Google Drive. Faça pelo menos uma vez por semana.</p>
    <p style="margin:0">${dd===null ? '<span class="pill warn">Nenhum backup feito ainda</span>' : `Último backup: <b>${fmtDate(S.config.ultimoBackup.slice(0,10))}</b> ${dd>7?'<span class="pill warn">faça um novo</span>':'<span class="pill ok">em dia</span>'}`}</p>
    <div class="row"><button class="btn primary" id="bkBaixar">Baixar backup agora</button></div>
    <details><summary style="cursor:pointer;font-weight:700">Restaurar de um arquivo de backup</summary>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        <p class="muted" style="margin:0">Grava de volta tudo o que está no arquivo. O que existe hoje e também está no arquivo volta a ficar como no backup; o resto não é apagado.</p>
        <input type="file" id="bkArq" accept=".json,application/json">
        <div id="bkInfo"></div>
      </div>
    </details>
  </section>`;
}
function baixarArquivo(nome, texto, tipo){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([texto], {type:tipo})); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function gerarBackup(){
  const out = {sistema:"Marmitex Gestão", versao:1, criadoEm:new Date().toISOString(), dados:{}};
  for(const col of COLS_BACKUP){
    try{ const snap = await window.__fs.collection(col).get(); out.dados[col] = {}; snap.forEach(d => { out.dados[col][d.id] = d.data(); }); }
    catch(e){ if(col!=="acesso") throw e; }
  }
  return out;
}
async function restaurarBackup(b, progresso){
  let n = 0; const total = Object.values(b.dados).reduce((s,o)=>s+Object.keys(o).length,0);
  for(const col of COLS_BACKUP){
    if(col==="acesso" && !souAdmin()) continue;
    const ent = Object.entries(b.dados[col]||{});
    for(let i=0; i<ent.length; i+=400){
      const lote = window.__fs.batch();
      ent.slice(i,i+400).forEach(([id,data]) => lote.set(window.__fs.collection(col).doc(id), data));
      await lote.commit(); n += Math.min(400, ent.length-i); progresso(n, total);
    }
  }
  return n;
}
function bindBackup(){
  const bb = $("#bkBaixar"); if(!bb) return;
  bb.onclick = async () => {
    bb.disabled = true; bb.textContent = "Preparando...";
    try{
      const b = await gerarBackup();
      const qtd = Object.values(b.dados).reduce((s,o)=>s+Object.keys(o).length,0);
      baixarArquivo("backup-marmitex-"+today()+".json", JSON.stringify(b), "application/json");
      await saveConfig({ultimoBackup:new Date().toISOString()});
      toast("Backup baixado: "+qtd+" registros."); render();
    }catch(e){ toast("Não foi possível fazer o backup ("+((e&&e.code)||"erro")+")."); bb.disabled = false; bb.textContent = "Baixar backup agora"; }
  };
  $("#bkArq").onchange = async e => {
    const f = e.target.files[0]; const info = $("#bkInfo"); if(!f) return;
    let b; try{ b = JSON.parse(await f.text()); }catch(err){ info.innerHTML = '<p class="banner">Esse arquivo não é um backup do sistema.</p>'; return; }
    if(!b || !b.dados || b.sistema!=="Marmitex Gestão"){ info.innerHTML = '<p class="banner">Esse arquivo não é um backup do sistema.</p>'; return; }
    const cont = Object.entries(b.dados).map(([k,o]) => k+": "+Object.keys(o).length).join(" · ");
    info.innerHTML = `<p style="margin:0">Backup de <b>${esc(new Date(b.criadoEm).toLocaleString("pt-BR"))}</b><br><span class="muted">${esc(cont)}</span></p><button class="btn danger" id="bkRest">Restaurar este backup</button>`;
    const br = $("#bkRest");
    br.onclick = async () => {
      if(!br.dataset.sure){ br.dataset.sure = "1"; br.textContent = "Toque de novo para confirmar"; return; }
      br.disabled = true;
      try{ const n = await restaurarBackup(b, (a,t) => { br.textContent = "Restaurando "+a+" de "+t+"..."; }); toast(n+" registros restaurados."); if(b.criadoEm) saveConfig({ultimoBackup:b.criadoEm}); info.innerHTML = '<p class="muted" style="margin:0">Restauração concluída.</p>'; }
      catch(err){ toast("A restauração parou ("+((err&&err.code)||"erro")+"). Tente de novo."); br.disabled = false; br.textContent = "Restaurar este backup"; delete br.dataset.sure; }
    };
  };
}

  return `<section class="panel" style="display:flex;flex-direction:column;gap:12px"><h2>Usuários do sistema</h2>
    <p class="muted" style="margin:0">${admin ? `Você é o administrador (${esc(meuEmail())}). Cadastre aqui quem pode entrar no sistema.` : `Você entrou como ${esc(meuEmail())}. Só o administrador cadastra usuários.`}</p>
    ${lista.length ? `<div class="tablebox"><table style="min-width:0"><thead><tr><th>Nome</th><th>E-mail</th>${admin?"<th></th>":""}</tr></thead><tbody>${lista.map(e=>`<tr><td>${esc((S.acesso.info[e.replace(/\./g,",")]||{}).nome||"—")}</td><td style="word-break:break-all">${esc(e)}</td>${admin?`<td style="white-space:nowrap;text-align:right"><button class="btn small" data-uReset="${esc(e)}">Trocar senha</button> <button class="btn small danger" data-uDel="${esc(e)}">Remover</button></td>`:""}</tr>`).join("")}</tbody></table></div>` : `<p class="muted" style="margin:0">Nenhum usuário cadastrado além do administrador.</p>`}
    ${admin ? `<div class="form">
      <label class="f c2">Nome<input type="text" id="u_nome" placeholder="Ex.: Carla (cozinha)"></label>
      <label class="f c2">E-mail<input type="text" id="u_email" inputmode="email" autocomplete="off"></label>
      <label class="f c2">Senha inicial (6 ou mais)<input type="text" id="u_senha" autocomplete="off"></label>
    </div>
    <div class="row"><button class="btn primary" id="u_add">Adicionar usuário</button><span class="muted" style="font-size:.85rem">Passe o e-mail e a senha para a pessoa. Ela entra pela mesma tela de login.</span></div>` : ""}
  </section>`;
}
async function salvarAcesso(emails, info){
  try{ await Store.set("acesso", "usuarios", {emails, info}); return true; }
  catch(e){ toast(e && (e.code==="permission-denied" || e.code==="invalid_argument") ? "Só o administrador pode mudar os usuários. Confira se as regras novas do Firebase foram publicadas." : erroMsg(e)); return false; }
}
async function criarConta(email, senha){
  const app = firebase.apps.find(a => a.name==="cadastro") || firebase.initializeApp(firebase.app().options, "cadastro");
  try{ await app.auth().createUserWithEmailAndPassword(email, senha); await app.auth().signOut(); return "criada"; }
  catch(e){ if(e && e.code==="auth/email-already-in-use") return "existente"; throw e; }
}
function bindUsuarios(){
  const add = $("#u_add"); if(!add) return;
  add.onclick = async () => {
    const nome = $("#u_nome").value.trim(), email = $("#u_email").value.trim().toLowerCase(), senha = $("#u_senha").value;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast("Digite um e-mail válido."); return; }
    if(email===meuEmail()){ toast("Esse é o seu e-mail de administrador."); return; }
    if(S.acesso.emails.includes(email)){ toast("Esse e-mail já está cadastrado."); return; }
    if(senha.length<6){ toast("A senha inicial precisa ter 6 ou mais caracteres."); return; }
    add.disabled = true; add.textContent = "Cadastrando...";
    let conta;
    try{ conta = await criarConta(email, senha); }
    catch(e){ toast(e && e.code==="auth/invalid-email" ? "Esse e-mail não é válido." : e && e.code==="auth/weak-password" ? "Senha muito fraca. Use 6 ou mais caracteres." : "Não foi possível criar a conta ("+((e&&e.code)||"erro")+")."); add.disabled = false; add.textContent = "Adicionar usuário"; return; }
    const info = Object.assign({}, S.acesso.info, {[email.replace(/\./g,",")]:{nome, desde:today()}});
    if(await salvarAcesso([...S.acesso.emails, email], info)){
      S.acesso = {emails:Array.from(new Set([...S.acesso.emails, email])), info}; render();
      toast(conta==="existente" ? "Usuário liberado. Esse e-mail já tinha conta e entra com a senha que já existe. Se não foi a pessoa que criou, remova e fale comigo." : "Usuário cadastrado. Passe o e-mail e a senha para a pessoa.");
    } else { add.disabled = false; add.textContent = "Adicionar usuário"; }
  };
  document.querySelectorAll("[data-uDel]").forEach(b => b.onclick = async () => {
    const email = b.dataset.udel;
    if(!b.dataset.sure){ b.dataset.sure = "1"; b.textContent = "Toque de novo para remover"; return; }
    const info = Object.assign({}, S.acesso.info); delete info[email.replace(/\./g,",")];
    const emails = S.acesso.emails.filter(e => e!==email);
    if(await salvarAcesso(emails, info)){ S.acesso = {emails, info}; render(); toast(email+" não entra mais no sistema."); }
  });
  document.querySelectorAll("[data-uReset]").forEach(b => b.onclick = () => {
    window.__auth.sendPasswordResetEmail(b.dataset.ureset).then(() => toast("Enviamos um e-mail para "+b.dataset.ureset+" criar uma nova senha.")).catch(e => toast("Não foi possível enviar ("+((e&&e.code)||"erro")+")."));
  });
}
BIND.ajustes = () => {
  bindMarca();
  if(window.__fs){ bindUsuarios(); bindBackup(); }
  $("#a_save").onclick = () => { const ferAntes = S.config.feriadosLocais||"", ferNovo = $("#a_fer").value.trim(); S.config.feriadosLocais = ferNovo; const abertos = ferNovo!==ferAntes ? S.config.abertos.filter(d => !(d>=today() && feriado(d))) : S.config.abertos; saveConfig({abertos, feriadosLocais:ferNovo, restaurante:$("#a_nome").value.trim(), meuNomeWhats:$("#a_wa").value.trim(), horarioLimite:$("#a_hora").value.trim()||"10:30", prazoTipo:$("#a_prazo").value, horaEntrega:$("#a_horaEnt").value.trim(), pixChave:$("#a_pix").value.trim(), pixNome:$("#a_pixNome").value.trim(), pixCidade:$("#a_pixCid").value.trim(), autoCadastro:$("#a_autoCad").checked, enderecoRestaurante:$("#a_end").value.trim(), cidade:$("#a_cid").value.trim(), telefoneRestaurante:$("#a_tel").value.trim(), custoMarmita:Number($("#a_custo").value)||0, custoFixoMensal:Number($("#a_fixo").value)||0, premioIndicacao:$("#a_premio").value.trim()||"1 marmita grátis", alertaSaldo:Number($("#a_alerta").value)||0, alertaDias:Number($("#a_alertaDias").value)||0, msgAlerta:$("#a_msg").value.trim()||DEFAULT_CONFIG.msgAlerta, autoPlano:$("#a_auto").checked}).then(()=>{ render(); toast("Ajustes salvos."); }); };
  document.querySelectorAll("[data-m]").forEach(cb => cb.onchange = () => { saveConfig({modulos:Object.assign({}, S.config.modulos, {[cb.dataset.m]:cb.checked})}); render(); });
};

// ---------- boot ----------
let rrT;
function rerenderSafe(){ invalidar(); clearTimeout(rrT); rrT = setTimeout(rerenderNow, 120); }
function rerenderNow(){
  // keep an open modal and typed input intact; only re-render the page behind it
  if($("#ov")) { renderNav(); return; }
  if(S.tab==="hoje" && document.activeElement && document.activeElement.id==="confBusca"){ renderConfirmados(); renderBuscaConf(); return; }
  const a = document.activeElement; if(a && a.closest && a.closest("#view") && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type!=="checkbox") return;
  render();
}
// a collection counts as loaded once the server (not just the local cache) has answered
const marcar = (col, m) => { if(!m || !m.fromCache) S.ready[col] = true; };
async function boot(){
  const h = (location.hash||"").slice(1); if(MODULOS.some(m=>m.id===h)) S.tab = h;
  render();
  await Store.init();
  Store.watch("clientes", (docs, m) => { S.clientes = docs; marcar("clientes", m); rerenderSafe(); automacoes(); });
  Store.watch("planos", (docs, m) => { S.planos = docs; marcar("planos", m); rerenderSafe(); automacoes(); });
  Store.watch("cardapios", docs => { S.cardapios = Object.fromEntries(docs.map(d=>[d.id,d])); rerenderSafe(); });
  Store.watch("pedidos", (docs, m) => { S.pedidos = Object.fromEntries(docs.map(d=>[d.id,d])); marcar("pedidos", m); rerenderSafe(); automacoes(); }, addDays(today(),-75));
  if(window.__fs) Store.watch("respostas", (docs, m) => { S.respostas = docs; marcar("respostas", m); rerenderSafe(); automacoes(); }, addDays(today(),-1));
  Store.watch("financeiro", docs => { S.fin = Object.fromEntries(docs.map(d=>[d.id,d])); rerenderSafe(); }, addDays(today(),-100));
  Store.watch("entregadores", docs => { S.entregadores = docs; rerenderSafe(); });
  Store.watch("pacotes", (docs, m) => { S.pacotes = docs; marcar("pacotes", m); rerenderSafe(); automacoes(); });
  Store.watch("precos", (docs, m) => { S.precos = docs; marcar("precos", m); rerenderSafe(); automacoes(); });
  Store.watch("promocoes", (docs, m) => { S.promocoes = docs; marcar("promocoes", m); rerenderSafe(); automacoes(); });
  if(window.__fs) Store.watch("assinaturas", (docs, m) => { S.assinaturas = docs; marcar("assinaturas", m); rerenderSafe(); automacoes(); });
  Store.watch("encomendas", docs => { S.encomendas = docs; rerenderSafe(); }, addDays(today(),-100));
  if(window.__fs) Store.watch("acesso", docs => { const u = docs.find(d => d.id==="usuarios") || {}; S.acesso = {emails:Array.isArray(u.emails)?u.emails:[], info:u.info||{}}; rerenderSafe(); });
  Store.watch("config", (docs, m) => { const g = docs.find(d=>d.id==="geral"); S.config = Object.assign(structuredClone(DEFAULT_CONFIG), g||{}); S.config.modulos = Object.assign({}, DEFAULT_CONFIG.modulos, (g&&g.modulos)||{}); delete S.config.id; marcar("config", m); aplicarMarca(); rerenderSafe(); automacoes(); });
  render();
}
window.__startApp = boot;
})();
</script>

<div id="gate" class="overlay" style="background:var(--bg);align-items:center">
  <div class="modal gbox" style="max-width:420px"><p class="muted">Carregando...</p></div>
</div>
<script>
(function(){
"use strict";
// Depois de criar o projeto no Firebase, você pode colar a configuração aqui
// para não precisar colar em cada aparelho. Exemplo: const FIREBASE_CONFIG = {apiKey:"...", authDomain:"...", projectId:"...", appId:"..."};
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD35S_8juHbOlb8DLssGdbuvhqzvuBE1bo",
  authDomain: "marmitex-148de.firebaseapp.com",
  projectId: "marmitex-148de",
  storageBucket: "marmitex-148de.firebasestorage.app",
  messagingSenderId: "162985128880",
  appId: "1:162985128880:web:492aa9289d5301d1b71c75"
};

const gate = document.getElementById("gate"), box = gate.querySelector(".gbox");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let started = false;
function getCfg(){
  if(FIREBASE_CONFIG) return FIREBASE_CONFIG;
  try{ return JSON.parse(localStorage.getItem("marmitex-fb")||"null"); }catch(e){ return null; }
}
function parseCfg(t){
  const o = {}; String(t).replace(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g, (m,k,v) => { o[k] = v; });
  return o.apiKey && o.projectId ? o : null;
}
function show(html){ gate.hidden = false; box.innerHTML = html; const f = box.querySelector("input,textarea"); f && f.focus(); }
function setupScreen(msg){
  show(`<h2>Configurar o Marmitex</h2>
    <p class="muted" style="margin:0">No Firebase, abra <b>Configurações do projeto &gt; Seus apps</b>, copie o bloco <b>firebaseConfig</b> e cole aqui. Isso é feito uma vez em cada aparelho.</p>
    <label class="f">Configuração do Firebase<textarea id="g_cfg" style="min-height:160px" placeholder='const firebaseConfig = {&#10;  apiKey: "AIza...",&#10;  authDomain: "marmitex-xxxx.firebaseapp.com",&#10;  projectId: "marmitex-xxxx",&#10;  ...&#10;};'></textarea></label>
    <p id="g_err" style="color:var(--bad);margin:0">${esc(msg||"")}</p>
    <div class="foot"><button class="btn" id="g_test">Usar sem Firebase (teste)</button><button class="btn primary" id="g_save">Salvar</button></div>`);
  document.getElementById("g_save").onclick = () => {
    const cfg = parseCfg(document.getElementById("g_cfg").value);
    if(!cfg){ document.getElementById("g_err").textContent = "Não reconheci a configuração. Copie o bloco inteiro, com apiKey e projectId."; return; }
    try{ localStorage.setItem("marmitex-fb", JSON.stringify(cfg)); }catch(e){}
    location.reload();
  };
  document.getElementById("g_test").onclick = () => { gate.hidden = true; if(!started){ started = true; window.__startApp(); } };
}
const AUTH_ERR = {
  "auth/invalid-credential":"E-mail ou senha incorretos.", "auth/wrong-password":"E-mail ou senha incorretos.", "auth/user-not-found":"E-mail ou senha incorretos.",
  "auth/invalid-email":"Esse e-mail não é válido.", "auth/email-already-in-use":"Esse e-mail já tem acesso. Use Entrar.",
  "auth/weak-password":"A senha precisa ter pelo menos 6 caracteres.", "auth/too-many-requests":"Muitas tentativas. Espere alguns minutos.",
  "auth/operation-not-allowed":"Ative o login por E-mail/senha no Firebase (Authentication > Método de login).",
  "auth/network-request-failed":"Sem internet. Confira a conexão.", "auth/unauthorized-domain":"Adicione este endereço em Authentication > Configurações > Domínios autorizados."
};
function loginScreen(msg){
  let lg = "", nm = ""; try{ lg = localStorage.getItem("marmitex-logo")||""; nm = localStorage.getItem("marmitex-nome")||""; }catch(e){}
  const logoHtml = /^data:image\/(png|jpeg|webp);base64,/.test(lg) ? `<img src="${lg}" alt="" style="width:88px;height:88px;object-fit:contain;border-radius:16px;align-self:center">` : "";
  show(`${logoHtml}<h2${logoHtml?' style="text-align:center"':""}>${esc(nm||"Marmitex Gestão")}</h2>
    <p class="muted" style="margin:0">Entre com seu e-mail e senha.</p>
    <form id="g_form" class="form" style="grid-template-columns:1fr">
      <label class="f">E-mail<input type="text" id="g_email" autocomplete="username" inputmode="email"></label>
      <label class="f">Senha<input type="password" id="g_pass" autocomplete="current-password"></label>
    </form>
    <p id="g_err" style="color:var(--bad);margin:0">${esc(msg||"")}</p>
    <div class="foot" style="justify-content:space-between"><button class="btn small" id="g_reset">Esqueci a senha</button><span style="flex:1"></span><button class="btn" id="g_new">Criar acesso</button><button class="btn primary" id="g_in">Entrar</button></div>
    <p class="muted" style="font-size:.8rem;margin:0">Primeira vez? Digite e-mail e uma senha e toque em Criar acesso. <button class="btn small" id="g_cfgchg" style="margin-left:4px">Trocar configuração</button></p>`);
  const em = () => document.getElementById("g_email").value.trim(), pw = () => document.getElementById("g_pass").value;
  const err = e => { document.getElementById("g_err").textContent = AUTH_ERR[e && e.code] || ("Não foi possível entrar ("+((e && e.code)||"erro")+")."); };
  const auth = firebase.auth();
  document.getElementById("g_in").onclick = () => auth.signInWithEmailAndPassword(em(), pw()).catch(err);
  document.getElementById("g_form").onsubmit = e => { e.preventDefault(); auth.signInWithEmailAndPassword(em(), pw()).catch(err); };
  document.getElementById("g_pass").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); auth.signInWithEmailAndPassword(em(), pw()).catch(err); } };
  document.getElementById("g_new").onclick = () => auth.createUserWithEmailAndPassword(em(), pw()).catch(err);
  document.getElementById("g_reset").onclick = () => { if(!em()){ document.getElementById("g_err").textContent = "Digite seu e-mail primeiro."; return; } auth.sendPasswordResetEmail(em()).then(() => { document.getElementById("g_err").textContent = "Enviamos um e-mail para trocar a senha."; }).catch(err); };
  document.getElementById("g_cfgchg").onclick = () => { if(FIREBASE_CONFIG) return; try{ localStorage.removeItem("marmitex-fb"); }catch(e){} location.reload(); };
}
function start(){
  const cfg = getCfg();
  if(!cfg) return setupScreen();
  if(!window.firebase){ show(`<h2>Sem conexão</h2><p class="muted">Não consegui carregar o sistema. Confira a internet e abra de novo.</p><div class="foot"><button class="btn primary" onclick="location.reload()">Tentar de novo</button></div>`); return; }
  try{ firebase.initializeApp(cfg); }catch(e){ return setupScreen("Configuração inválida: "+e.message); }
  const fs = firebase.firestore();
  try{ fs.settings({ignoreUndefinedProperties:true, merge:true}); }catch(e){}
  fs.enablePersistence({synchronizeTabs:true}).catch(() => {});
  firebase.auth().onAuthStateChanged(u => {
    if(u){
      gate.hidden = true; window.__fs = fs; window.__auth = firebase.auth();
      if(!started){ started = true; window.__startApp(); }
    } else {
      if(started){ location.reload(); return; }
      loginScreen();
    }
  });
}
document.addEventListener("click", e => { if(e.target && e.target.id==="sairBtn" && window.__auth) window.__auth.signOut(); });
start();
})();
</script>
